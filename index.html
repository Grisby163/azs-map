<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта АЗС</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --bg: #FAF6F1;
      --surface: #FFFFFF;
      --surface-glass: rgba(255, 255, 255, 0.92);
      --border: #E8E1D8;
      --text: #1F1B16;
      --text-muted: #78716C;
      --accent: #E8720C;
      --accent-hover: #C75F00;
      --success: #16A34A;
      --danger: #DC2626;
      --warn: #D97706;
      --warn-bg: #FEF3E2;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-soft: 0 2px 8px rgba(31, 27, 22, 0.08);
      --shadow-card: 0 8px 24px rgba(31, 27, 22, 0.12);
      --gradient-accent: linear-gradient(135deg, #F59E0B 0%, #E8720C 100%);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      line-height: 1.5;
    }
    #map { height: 100vh; width: 100%; }

    .leaflet-control-attribution {
      display: none !important;
    }
    
    /* ---------- Верхняя панель управления ---------- */
    .control-panel {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 14px;
      border-radius: 999px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      max-width: calc(100% - 28px);
    }
    
    /* ---------- Вкладки «Вся сеть / Мой маршрут» ---------- */
    .view-tabs {
      display: flex;
      gap: 4px;
      padding: 3px;
      background: rgba(232, 225, 216, 0.5);
      border-radius: 999px;
      justify-content: center;
      margin-bottom: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }
    
    .control-panel > * {
      width: 100%;
      flex-basis: auto;
    }
    .control-panel #map-title {
      text-align: center;
      margin-bottom: 2px;
    }
    .control-panel .routes-switcher,
    .control-panel .view-tabs {
      justify-content: center;
      margin-bottom: 0;
    }
    .view-tab {
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .18s, color .18s, box-shadow .18s;
      white-space: nowrap;
    }
    .view-tab:hover {
      background: rgba(255, 255, 255, 0.7);
      color: var(--text);
    }
    .view-tab.active {
      background: var(--gradient-accent);
      color: #fff;
      box-shadow: 0 3px 10px rgba(232, 114, 12, 0.3);
    }
    
    /* ---------- Переключатель маршрутов ---------- */
    .routes-switcher {
      display: flex;
      gap: 4px;
      padding: 3px;
      background: rgba(232, 225, 216, 0.5);
      border-radius: 999px;
      justify-content: center;
      margin-bottom: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
    }
    .routes-switcher::-webkit-scrollbar { display: none; }
    .route-switch-btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .18s, color .18s, box-shadow .18s;
      white-space: nowrap;
      flex-shrink: 0;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-switch-btn:hover {
      background: rgba(255, 255, 255, 0.7);
      color: var(--text);
    }
    .route-switch-btn.active {
      background: var(--gradient-accent);
      color: #fff;
      box-shadow: 0 3px 10px rgba(232, 114, 12, 0.3);
    }

    /* ---------- Фильтр топлива: кнопка и выпадающая плашка ---------- */
    .fuel-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      transition: background .18s, border-color .18s, color .18s, box-shadow .18s;
      white-space: nowrap;
      box-shadow: none;
      margin: 0;
    }
    .fuel-filter-btn:hover {
      background: rgba(232, 114, 12, 0.08);
      border-color: var(--accent);
      color: var(--accent);
    }
    .fuel-filter-btn.open {
      background: var(--gradient-accent);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 3px 10px rgba(232, 114, 12, 0.3);
    }
    .fuel-filter-arrow {
      font-size: 10px;
      transition: transform .2s;
      display: inline-block;
    }
    .fuel-filter-btn.open .fuel-filter-arrow {
      transform: rotate(180deg);
    }

    .fuel-filter-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      padding: 6px;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .fuel-option {
      padding: 9px 14px;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      color: var(--text);
      text-align: left;
      transition: background .15s, color .15s;
      box-shadow: none;
      margin: 0;
      width: 100%;
    }
    .fuel-option:hover {
      background: rgba(232, 114, 12, 0.10);
      color: var(--accent);
    }
    .fuel-option.active {
      background: var(--gradient-accent);
      color: #fff;
    }

    /* Заголовок карты в панели */
    #map-title {
      color: var(--text) !important;
      font-weight: 700 !important;
      font-size: 14px !important;
      letter-spacing: -0.01em;
    }

    /* ---------- Popup цены ---------- */
    .leaflet-popup-content-wrapper {
      border-radius: var(--radius-md) !important;
      box-shadow: var(--shadow-card) !important;
      border: 1px solid var(--border);
    }
    .leaflet-popup-content {
      margin: 14px 16px !important;
      font-size: 13.5px !important;
      line-height: 1.55 !important;
      color: var(--text) !important;
    }
    .leaflet-popup-tip {
      box-shadow: none !important;
    }

    /* ---------- Звезда для лучшей цены ---------- */
    .best-price-marker {
      font-size: 28px;
      line-height: 28px;
      text-align: center;
      color: #16A34A;
      text-shadow: 0 0 0 #fff, 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 0 2px 6px rgba(0,0,0,0.35);
      font-family: Arial, sans-serif;
      font-weight: 900;
      pointer-events: auto;
      cursor: pointer;
      transition: transform .15s;
    }
    .best-price-marker:hover { transform: scale(1.15); }

    /* ---------- Плашка топ-3 сетей ---------- */
    #top-networks-bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 1500;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(31, 27, 22, 0.14);
      display: none;
      max-width: calc(100% - 28px);
    }
    #top-networks-bar.visible { display: block; }

    .top-networks-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
      text-align: center;
    }

    .top-networks-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .top-networks-row::-webkit-scrollbar { display: none; }

    .top-network-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      background: #FAF6F1;
      border: 1px solid var(--border);
      min-width: 180px;
      transition: transform .12s, box-shadow .18s;
    }
    .top-network-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(31, 27, 22, 0.10);
    }
    .top-network-card.best {
      background: linear-gradient(135deg, rgba(22, 163, 74, 0.12) 0%, rgba(22, 163, 74, 0.04) 100%);
      border: 1.5px solid rgba(22, 163, 74, 0.4);
    }
    .top-network-card.best .tn-price {
      color: #16A34A;
      font-size: 18px;
    }

    .tn-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .tn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tn-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 140px;
    }
    .tn-region {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .tn-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tn-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .tn-show-btn {
      padding: 5px 10px;
      background: var(--gradient-accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 2px 5px rgba(232, 114, 12, 0.3);
      transition: transform .12s, box-shadow .18s;
      margin: 0;
    }
    .tn-show-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(232, 114, 12, 0.4);
    }
    .top-network-card.best .tn-show-btn {
      background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
      box-shadow: 0 2px 5px rgba(22, 163, 74, 0.3);
    }
    .top-network-card.best .tn-show-btn:hover {
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4);
    }

    @media (max-width: 820px) {
      #top-networks-bar { display: none !important; }
    }

    /* ---------- Нижняя строка «Лучшая цена» ---------- */
    #best-price-bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 1500;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(31, 27, 22, 0.14);
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      white-space: nowrap;
      max-width: calc(100% - 28px);
    }
    #best-price-bar.visible { display: flex; }
    #best-price-bar .star { color: #16A34A; font-size: 18px; line-height: 1; }
    #best-price-bar .label { color: var(--text-muted); font-weight: 500; }
    #best-price-bar .value { color: #16A34A; font-weight: 700; font-size: 16px; }
    #best-price-bar .network { color: var(--text); font-weight: 600; }
    #best-price-bar .show-btn {
      padding: 7px 14px;
      background: var(--gradient-accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(232, 114, 12, 0.3);
      transition: transform .12s, box-shadow .18s;
      margin: 0;
    }
    #best-price-bar .show-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(232, 114, 12, 0.4);
    }

    .popup-price { font-size: 17px; font-weight: 700; color: var(--accent); margin-top: 8px; display: block; }
    .popup-address-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    .copy-addr-btn {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 12px;
      font-family: inherit; line-height: 1; margin: 0; box-shadow: none;
      transition: background .15s, color .15s, border-color .15s; flex-shrink: 0;
    }
    .copy-addr-btn:hover { background: var(--warn-bg); color: var(--accent); border-color: var(--accent); box-shadow: none; transform: none; }
    .popup-region { margin-top: 8px; font-size: 12px; color: var(--text-muted); }
    .popup-discount { margin-top: 8px; color: var(--danger); font-weight: 700; }
    .popup-no-price { margin-top: 8px; color: var(--text-muted); font-style: italic; }
    .market-info { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
    .saving-info { font-size: 13px; color: var(--success); font-weight: 700; margin-top: 4px; background: #ECFDF5; padding: 3px 8px; border-radius: 6px; display: inline-block; }

    /* ---------- Раскрывающиеся сети и сворачивание панели ---------- */
    .network-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .network-header h4 { margin: 0; }
    .panel-toggle {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      border-radius: 50%; width: 30px; height: 30px; display: none; align-items: center;
      justify-content: center; cursor: pointer; font-size: 16px; padding: 0;
      line-height: 1; transition: background .15s, color .15s;
    }
    .panel-toggle:hover { background: var(--warn-bg); color: var(--accent); }
    .network-item-clickable { cursor: pointer; user-select: none; }
    .network-item-clickable .network-arrow { display: inline-block; margin-left: 6px; transition: transform .2s; color: var(--text-muted); font-size: 10px; }
    .network-item-clickable.expanded .network-arrow { transform: rotate(90deg); }
    .network-item.cheapest { background: linear-gradient(135deg, rgba(22, 163, 74, 0.15) 0%, rgba(22, 163, 74, 0.06) 100%); border: 1px solid rgba(22, 163, 74, 0.35); border-radius: 8px; margin: 4px 0; padding-left: 8px; padding-right: 8px; }
    .network-item.cheapest .network-price { color: #16A34A; font-size: 15px; }
    .network-price { font-weight: 700; color: var(--text); }
    .network-region { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .network-stations { display: none; padding: 4px 8px 8px 24px; background: rgba(250, 246, 241, 0.5); border-radius: 8px; margin-top: 2px; }
    .network-stations.expanded { display: block; }
    .station-row { padding: 8px 6px; border-bottom: 1px solid rgba(232, 225, 216, 0.6); cursor: pointer; transition: background .15s; border-radius: 6px; }
    .station-row:last-child { border-bottom: none; }
    .station-row:hover { background: rgba(255, 255, 255, 0.8); }
    .station-row-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .station-row-addr { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
    .station-row-price { font-size: 12px; font-weight: 700; color: var(--accent); margin-top: 2px; }

    /* Свёрнутая панель на мобильной */
    @media (max-width: 820px) {
      .panel-toggle { display: inline-flex; }
      .network-panel.collapsed { max-height: 52px; overflow: hidden; }
      .network-panel.collapsed .network-header { margin-bottom: 0; }
      .network-panel.collapsed .network-list, .network-panel.collapsed .download-btn { display: none; }
      .network-panel.collapsed .panel-toggle { transform: rotate(180deg); }
    }
    /* ---------- Правая панель сетей ---------- */
    .network-panel {
      position: absolute; top: 50%; right: 14px; transform: translateY(-50%);
      z-index: 1001; background: var(--surface-glass); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px); padding: 16px; border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card); border: 1px solid var(--border); max-width: 280px;
      display: none; font-size: 13px;
    }
    .network-panel h4 { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .network-list { max-height: 320px; overflow-y: auto; scrollbar-width: thin; }
    .network-list::-webkit-scrollbar { width: 6px; }
    .network-list::-webkit-scrollbar-thumb { background: #D6CFC7; border-radius: 3px; }
    .network-item { display: flex; justify-content: space-between; padding: 8px 6px; border-bottom: 1px solid #F1EBE3; align-items: center; gap: 8px; }
    .network-item:last-child { border-bottom: none; }
    .network-item.opt { background: rgba(236, 253, 245, 0.7); border-radius: 6px; margin: 2px 0; border-bottom: none; }
    .network-item.best { background: rgba(254, 243, 226, 0.7); border-radius: 6px; margin: 2px 0; border-bottom: none; }
    .dot-indicator { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; display: inline-block; vertical-align: middle; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(31,27,22,0.08); }

    /* Кнопка Excel */
    .download-btn {
      display: block; margin-top: 14px; padding: 10px 14px; background: var(--gradient-accent);
      color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer;
      width: 100%; font-size: 13.5px; font-weight: 700; font-family: inherit;
      box-shadow: 0 3px 10px rgba(232, 114, 12, 0.28); transition: transform .12s, box-shadow .18s, filter .18s;
    }
    .download-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(232, 114, 12, 0.35); filter: brightness(1.03); }

    /* ---------- Приветствие ---------- */
    .greeting-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(31, 27, 22, 0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .greeting-modal { background: var(--surface); padding: 32px 28px; border-radius: var(--radius-lg); text-align: center; max-width: 420px; box-shadow: var(--shadow-card); border: 1px solid var(--border); animation: popIn .28s ease; }
    @keyframes popIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
    .greeting-modal h2 { margin: 10px 0 12px; font-size: 20px; color: var(--text); letter-spacing: -0.01em; }
    .greeting-modal p { margin: 0 0 20px; font-size: 14px; color: var(--text-muted); line-height: 1.55; }
    .greeting-modal button { margin-top: 4px; padding: 11px 28px; background: var(--gradient-accent); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 3px 10px rgba(232, 114, 12, 0.3); transition: transform .12s, box-shadow .18s, filter .18s; font-family: inherit; }
    .greeting-modal button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(232, 114, 12, 0.38); filter: brightness(1.03); }
    .greeting-banner { position: fixed; top: 14px; right: 14px; z-index: 10001; background: var(--text); color: #F5F0E8; padding: 12px 18px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; box-shadow: var(--shadow-card); display: none; max-width: 320px; }

    /* ---------- Ссылка на Яндекс.Карты ---------- */
    #yandex-link-container a { background: var(--surface-glass) !important; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 10px 16px !important; border-radius: 999px !important; box-shadow: var(--shadow-soft) !important; border: 1px solid var(--border); color: var(--text) !important; font-weight: 600; font-size: 13px; text-decoration: none !important; transition: transform .12s, box-shadow .18s, color .18s; }
    #yandex-link-container a:hover { color: var(--accent) !important; transform: translateY(-1px); box-shadow: var(--shadow-card) !important; }

    /* ---------- Адаптивность ---------- */
    @media (max-width: 820px) {
      .control-panel { padding: 8px 10px; gap: 5px; max-width: calc(100% - 16px); top: 8px; border-radius: var(--radius-md); }
      #fuel-panel { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 2px; flex: 1; }
      #fuel-panel::-webkit-scrollbar { display: none; }
      .fuel-btn, .route-btn { padding: 9px 14px; font-size: 13px; min-height: 38px; flex-shrink: 0; min-width: 54px; }
      #map-title { font-size: 12px !important; flex-basis: 100%; text-align: center; padding: 0 4px 2px; line-height: 1.3; color: var(--text-muted) !important; }
      .leaflet-popup-content { margin: 14px 16px !important; font-size: 14.5px !important; line-height: 1.6 !important; }
      .popup-price { font-size: 20px; }
      .copy-addr-btn { padding: 6px 10px; font-size: 14px; min-height: 32px; min-width: 32px; }
      .network-panel { top: auto; bottom: 0; right: 0; left: 0; transform: none; max-width: none; max-height: 50vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: none; padding: 14px 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
      .network-panel h4 { font-size: 15px; text-align: center; position: relative; padding-top: 4px; }
      .network-panel h4::before { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; background: #D6CFC7; border-radius: 2px; }
      .network-list { max-height: 32vh; }
      .download-btn { width: 100%; padding: 12px 16px; font-size: 14px; border-radius: var(--radius-sm); margin-top: 12px; box-shadow: 0 3px 10px rgba(232, 114, 12, 0.3); }
      .greeting-modal { padding: 24px 20px; max-width: 92vw; }
      .greeting-modal h2 { font-size: 18px; }
      .greeting-modal button { width: 100%; }
      .greeting-banner { top: auto; bottom: 14px; right: 14px; left: 14px; max-width: none; }
      #yandex-link-container { bottom: 14px !important; left: 14px !important; }
      #yandex-link-container a { padding: 12px 16px !important; font-size: 13px; }
    }

    /* ---------- Переключатель внешних сетей ---------- */
    .external-switcher { display: flex; gap: 4px; padding: 3px; background: rgba(232, 225, 216, 0.5); border-radius: 999px; justify-content: center; margin-bottom: 6px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
    .external-switcher::-webkit-scrollbar { display: none; }
    .external-switch-btn { padding: 7px 16px; border-radius: 999px; border: none; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .18s, color .18s; white-space: nowrap; flex-shrink: 0; }
    .external-switch-btn.active { background: var(--gradient-accent); color: #fff; box-shadow: 0 3px 10px rgba(232, 114, 12, 0.3); }

    /* ---------- Панель фильтра внешних сетей ---------- */
    .external-filter-panel { position: absolute; top: 14px; right: 14px; z-index: 1001; background: var(--surface-glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 12px 14px; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); border: 1px solid var(--border); max-width: 260px; font-size: 13px; }
    .external-filter-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .external-filter-list { display: flex; flex-direction: column; gap: 4px; }
    .external-filter-item { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: background .15s; }
    .external-filter-item:hover { background: rgba(232, 114, 12, 0.08); }
    .external-filter-item input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; flex-shrink: 0; }
    .external-filter-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(31,27,22,0.08); }
    @media (max-width: 820px) { .external-filter-panel { top: auto; bottom: 14px; right: 8px; left: 8px; max-width: none; } }

    /* ---------- Убираем выделение текста ---------- */
    body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
    input, textarea, select, .leaflet-popup-content { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
  </style>
</head>
<body>
  <div class="control-panel">
    <div id="fuel-filter-wrapper" style="position: relative;">
      <button id="fuel-filter-btn" class="fuel-filter-btn" onclick="toggleFuelFilter(event)">
        <span id="fuel-filter-label">Фильтр · ДТ-Л</span>
        <span class="fuel-filter-arrow">▾</span>
      </button>
      <div id="fuel-filter-dropdown" class="fuel-filter-dropdown" style="display:none;">
        <!-- Кнопки будут добавлены динамически через JS -->
      </div>
    </div>
  </div>
  <div id="map"></div>
  <div class="network-panel" id="network-panel">
    <div class="network-header">
      <h4 id="network-panel-title">АЗС на маршруте</h4>
      <button class="panel-toggle" onclick="togglePanel()" title="Свернуть">▼</button>
    </div>
    <div class="network-list" id="network-list"></div>
    <button class="download-btn" onclick="downloadExcel()">📥 Скачать Excel</button>
  </div>

  <div id="external-filter-panel" class="external-filter-panel" style="display:none;">
    <div class="external-filter-title">Сети на карте</div>
    <div id="external-filter-list" class="external-filter-list"></div>
  </div>
  <div id="yandex-link-container" style="display:none; position:absolute; bottom: 10px; left: 10px; z-index: 1000;">
    <a id="yandex-link" href="#" target="_blank" style="background: #fff; padding: 8px 12px; border-radius: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); text-decoration: none; color: #000;">Открыть в Яндекс.Картах</a>
  </div>
  <div id="greeting-overlay" class="greeting-overlay" style="display:none;">
    <div class="greeting-modal">
      <span style="font-size:48px;">🤝</span>
      <h2>Специальное предложение</h2>
      <p id="greeting-text"></p>
      <button onclick="document.getElementById('greeting-overlay').style.display='none'">Понятно</button>
    </div>
  </div>
  <div id="greeting-banner" class="greeting-banner"></div>
  <div id="best-price-bar">
    <span class="star">★</span>
    <span class="label">Лучшая цена:</span>
    <span class="value" id="best-price-value">—</span>
    <span class="network" id="best-price-network"></span>
    <button class="show-btn" onclick="focusBestPrice()">Показать</button>
  </div>
  <div id="top-networks-bar">
    <div class="top-networks-title">Лучшие цены по стране</div>
    <div class="top-networks-row" id="top-networks-row"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (!token) {
      document.body.innerHTML = '<h2 style="text-align:center;margin-top:50px;">Не указан токен</h2>';
      throw new Error('Token missing');
    }

    const API_URL = 'https://cbctbbaekgmsogfxpvoy.supabase.co/functions/v1/quick-service';
    const GH_API_KEY = 'a4b49645-1e81-4a2e-a019-741d76b2903c'; // замените при необходимости

    // Инициализация Leaflet
    const map = L.map('map', { attributionControl: false }).setView([55.75, 37.62], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'OSM'
    }).addTo(map);

    let allStations = [];
    let currentFuel = 'ДТ-Л';
    let markersLayer = L.layerGroup().addTo(map);
    let routeLine = null;
    let filteredStations = [];

    // Текущий вид карты: 'route' (только маршрут) или 'network' (вся сеть).
    let currentView = 'route';

    // Слой станций вдоль маршрута. Заполняется при построении карты в конструкторе.
    let stationsOnRoute = [];
    // Новое: данные, приходящие из meta от quick-service
    let clientRouteGeojson = null;   // геометрия маршрута от менеджера
    let clientMapTitle = null;       // заголовок карты
    let clientRadiusKm = 5;          // радиус, с которым строился маршрут
    let clientRouteLine = null; 
    // Пункт 2.3. Массив маршрутов и активный маршрут.
    let clientRoutes = [];           // [{ id, name, geojson, radius_km }]
    let activeRouteIndex = 0;        // индекс активного маршрута
    let clientRouteLines = [];       // массив слоёв Leaflet (по одному на маршрут)
    // Внешние сети (Лукойл, Роснефть) — станции без цен.
    let clientExternalStations = [];
    let currentExternalNetwork = 'Лукойл'; // активная под-вкладка
    let externalLayer = null;              // слой с кластеризацией
    let externalColors = {
      'Лукойл':   '#DC2626',
      'Роснефть': '#EAB308',
    };

    const highwayRoutes = {
      m10: { name: "Москва – Санкт‑Петербург (М10)", coords: [[37.5634,55.7756],[35.9176,56.8587],[34.9604,57.0411],[33.2486,57.9797],[31.2749,58.5228],[30.5043,59.8066]], radius: 5 },
      m4:  { name: "Москва – Краснодар (М4)", coords: [[37.6073,55.5796],[39.1844,51.6720],[39.7187,47.2225],[38.9753,45.0355]], radius: 5 },
      m5:  { name: "Москва – Владивосток (М5)", coords: [[37.7145,55.5854],[39.6916,54.6269],[45.0184,53.1959],[50.1002,53.1959],[55.9578,54.7348],[61.4368,55.1644],[65.3053,55.4649],[73.3682,54.9893],[82.9357,55.0084],[92.8526,56.0105],[104.2807,52.2864],[107.5842,51.8335],[113.4994,52.0340],[119.7308,53.7574],[127.2411,52.4493],[127.5274,50.2525],[135.0718,48.4802],[131.8855,43.1155]], radius: 5 },
      m7:  { name: "Москва – Владивосток (М7)", coords: [[37.6252,55.7530],[40.3966,56.1365],[43.9361,56.2965],[49.1233,55.7879],[56.2502,58.0105],[60.6057,56.8389],[65.5272,57.1522],[73.3682,54.9893],[82.9357,55.0084],[92.8526,56.0105],[104.2807,52.2864],[107.5842,51.8335],[113.4994,52.0340],[119.7308,53.7574],[127.2411,52.4493],[127.5274,50.2525],[135.0718,48.4802],[131.8855,43.1155]], radius: 5 }
    };

    // ============================================================
    // Фильтр топлива: раскрывающаяся плашка
    // ============================================================

    function buildFuelButtons() {
      const fuelsSet = new Set();
      allStations.forEach(station => {
        if (station.prices) {
          station.prices.forEach(p => {
            if (p.fuel_type) fuelsSet.add(p.fuel_type);
          });
        }
      });
      
      let fuels = Array.from(fuelsSet).sort();
      if (fuels.length === 0) fuels.push('ДТ-Л'); 

      if (!fuels.includes(currentFuel)) {
        currentFuel = fuels.includes('ДТ-Л') ? 'ДТ-Л' : fuels[0];
      }

      const dropdown = document.getElementById('fuel-filter-dropdown');
      if (!dropdown) return;
      
      dropdown.innerHTML = '';
      fuels.forEach(fuel => {
        const btn = document.createElement('button');
        btn.className = 'fuel-option' + (fuel === currentFuel ? ' active' : '');
        btn.textContent = fuel;
        btn.dataset.fuel = fuel;
        btn.onclick = () => selectFuel(fuel);
        dropdown.appendChild(btn);
      });
      
      updateFuelFilterLabel();
    }

    function updateFuelFilterLabel() {
      const label = document.getElementById('fuel-filter-label');
      if (label) label.textContent = 'Фильтр · ' + currentFuel;

      document.querySelectorAll('.fuel-option').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.fuel === currentFuel);
      });
    }

    function toggleFuelFilter(event) {
      if (event) event.stopPropagation();
      const dropdown = document.getElementById('fuel-filter-dropdown');
      const btn = document.getElementById('fuel-filter-btn');
      if (!dropdown || !btn) return;
      const isOpen = dropdown.style.display === 'flex' || dropdown.style.display === 'block';
      if (isOpen) {
        closeFuelFilter();
      } else {
        dropdown.style.display = 'flex';
        btn.classList.add('open');
      }
    }

    function closeFuelFilter() {
      const dropdown = document.getElementById('fuel-filter-dropdown');
      const btn = document.getElementById('fuel-filter-btn');
      if (dropdown) dropdown.style.display = 'none';
      if (btn) btn.classList.remove('open');
    }

    function selectFuel(fuel) {
      currentFuel = fuel;
      updateFuelFilterLabel();
      closeFuelFilter();
      applyFilters();
    }

    // Закрытие плашки при клике вне её.
    document.addEventListener('click', function(e) {
      const wrapper = document.getElementById('fuel-filter-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        closeFuelFilter();
      }
    });

    function initFuelFilter() {
      updateFuelFilterLabel();
    }

    function getPriceForFuel(station, fuel) {
      if (!station.prices || station.prices.length === 0) return null;
      return station.prices.find(p => p.fuel_type === fuel) || null;
    }

    function getMarkerColor(station, price) {
      if (station.color_code === 1) return '#16A34A'; // Яркий зелёный
      if (station.color_code === 2) return '#84CC16'; // Салатовый
      if (station.color_code === 3) return '#1E88E5'; // Синий

      if (!price) return '#1E88E5';
      if (currentFuel === 'Газ') return '#1E88E5';

      if (price.is_discount) {
        const text = (price.discount_text || '').toUpperCase();
        if (text.includes('НАЦЕНКА')) return '#84CC16';
        return '#16A34A';
      }

      const validPrices = filteredStations
        .map(s => getPriceForFuel(s, currentFuel))
        .filter(p => p && !p.is_discount && p.price_value > 0)
        .map(p => p.price_value);

      if (validPrices.length === 0) return '#1E88E5';

      const avg = validPrices.reduce((sum, v) => sum + v, 0) / validPrices.length;
      if (price.price_value < avg) return '#16A34A';
      return '#84CC16';
    }

    function applyFilters() {
      if (currentView === 'external') {
        markersLayer.clearLayers();
        document.getElementById('network-panel').style.display = 'none';
        document.getElementById('best-price-bar').classList.remove('visible');
        document.getElementById('top-networks-bar').classList.remove('visible');
        return;
      }

      let baseStations;
      if (clientRouteGeojson && currentView === 'route') {
        baseStations = stationsOnRoute;
      } else {
        baseStations = allStations;
      }

      const stations = baseStations.filter(
        station => getPriceForFuel(station, currentFuel) !== null
      );
      filteredStations = stations;
      displayStations(stations);

      if (stations.length > 0) {
        updateNetworkPanel(stations);
        const titleEl = document.getElementById('network-panel-title');
        if (titleEl) {
          titleEl.textContent = (clientRouteGeojson && currentView === 'route')
            ? 'АЗС на маршруте'
            : 'Все сети';
        }
        document.getElementById('network-panel').style.display = 'block';
        document.body.classList.add('has-network-panel');
      } else {
        document.getElementById('network-panel').style.display = 'none';
        document.body.classList.remove('has-network-panel');
      }
    }

    let bestPriceStation = null;
    let bestPriceValue = null;
    let topNetworksCache = [];

    function focusWithOffset(latlng, zoom) {
      const targetZoom = Math.max(map.getZoom(), zoom || 13);
      const point = map.project(L.latLng(latlng[0], latlng[1]), targetZoom);
      const offsetY = 100;
      const newPoint = point.subtract([0, offsetY]);
      const newLatLng = map.unproject(newPoint, targetZoom);
      map.setView(newLatLng, targetZoom, { animate: true });
    }

    function openPopupAt(latlng) {
      markersLayer.eachLayer(layer => {
        const ll = layer.getLatLng && layer.getLatLng();
        if (ll && Math.abs(ll.lat - latlng[0]) < 0.00001 && Math.abs(ll.lng - latlng[1]) < 0.00001) {
          if (layer.openPopup) layer.openPopup();
        }
      });
    }

    function updateBestPriceBar() {
      const bar = document.getElementById('best-price-bar');
      if (!bar) return;

      const isNetworkView = !clientRouteGeojson || currentView === 'network';
      if (isNetworkView && window.innerWidth > 820) {
        bar.classList.remove('visible');
        return;
      }

      if (!bestPriceStation || bestPriceValue === null) {
        bar.classList.remove('visible');
        return;
      }
      document.getElementById('best-price-value').textContent = bestPriceValue.toFixed(2) + ' ₽/л';
      document.getElementById('best-price-network').textContent =
        bestPriceStation.network_name ? '• ' + bestPriceStation.network_name : '';
      bar.classList.add('visible');
    }

    function focusBestPrice() {
      if (!bestPriceStation || !bestPriceStation.lat || !bestPriceStation.lon) return;
      const latlng = [bestPriceStation.lat, bestPriceStation.lon];
      focusWithOffset(latlng);
      setTimeout(() => openPopupAt(latlng), 350);
    }

    function updateTopNetworksBar() {
      const bar = document.getElementById('top-networks-bar');
      const row = document.getElementById('top-networks-row');
      if (!bar || !row) return;

      const isNetworkView = !clientRouteGeojson || currentView === 'network';
      const isDesktop = window.innerWidth > 820;

      if (!isNetworkView || !isDesktop) {
        bar.classList.remove('visible');
        topNetworksCache = [];
        return;
      }

      const byNet = {};
      filteredStations.forEach(station => {
        const name = station.network_name || 'Прочие';
        const p = getPriceForFuel(station, currentFuel);
        if (!p || p.is_discount || !p.price_value) return;

        if (!byNet[name]) {
          byNet[name] = {
            name,
            region: station.region || '',
            minPrice: p.price_value,
            bestStation: station,
            color: getMarkerColor(station, p)
          };
        } else if (p.price_value < byNet[name].minPrice) {
          byNet[name].minPrice = p.price_value;
          byNet[name].bestStation = station;
        }
      });

      const sorted = Object.values(byNet).sort((a, b) => a.minPrice - b.minPrice).slice(0, 3);

      if (sorted.length === 0) {
        bar.classList.remove('visible');
        topNetworksCache = [];
        return;
      }

      topNetworksCache = sorted;

      row.innerHTML = sorted.map((net, idx) => {
        const isBest = idx === 0;
        return `<div class="top-network-card ${isBest ? 'best' : ''}">
          <div class="tn-header">
            <span class="tn-dot" style="background:${net.color}"></span>
            <span class="tn-name" title="${net.name}">${net.name}</span>
          </div>
          ${net.region ? `<div class="tn-region">${net.region}</div>` : ''}
          <div class="tn-footer">
            <span class="tn-price">${net.minPrice.toFixed(2)} ₽/л</span>
            <button class="tn-show-btn" onclick="focusTopNetwork(${idx})">Показать</button>
          </div>
        </div>`;
      }).join('');

      bar.classList.add('visible');
    }

    function focusTopNetwork(idx) {
      const net = topNetworksCache[idx];
      if (!net || !net.bestStation) return;
      const st = net.bestStation;
      if (!st.lat || !st.lon) return;
      const latlng = [st.lat, st.lon];
      focusWithOffset(latlng);
      setTimeout(() => openPopupAt(latlng), 350);
    }

    function displayStations(stations) {
      markersLayer.clearLayers();
      bestPriceStation = null;
      bestPriceValue = null;

      stations.forEach(station => {
        const p = getPriceForFuel(station, currentFuel);
        if (p && !p.is_discount && p.price_value > 0) {
          if (bestPriceValue === null || p.price_value < bestPriceValue) {
            bestPriceValue = p.price_value;
            bestPriceStation = station;
          }
        }
      });

      stations.forEach(station => {
        const price = getPriceForFuel(station, currentFuel);
        const color = getMarkerColor(station, price);

        let marker;
        const isBest = bestPriceStation && station.id === bestPriceStation.id;

        if (isBest) {
          const icon = L.divIcon({
            className: '',
            html: '<div class="best-price-marker">★</div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14],
            popupAnchor: [0, -14]
          });
          marker = L.marker([station.lat, station.lon], { icon }).addTo(markersLayer);
        } else {
          marker = L.circleMarker([station.lat, station.lon], {
            radius: 10,
            fillColor: color,
            color: '#fff',
            weight: 2.5,
            fillOpacity: 0.95
          }).addTo(markersLayer);
        }

        let popupContent = `<b>${station.name || 'АЗС'}</b>`;

        if (station.address) {
          popupContent += `<div class="popup-address-row">`;
          popupContent += `<span>${station.address}</span>`;
          popupContent += `<button class="copy-addr-btn" title="Скопировать адрес" onclick="copyAddressById('${station.id}', this)">📋</button>`;
          popupContent += `</div>`;
        }

        if (price) {
          if (price.is_discount) {
            const text = (price.discount_text || 'уточняйте');
            const upper = text.toUpperCase();
            const textColor = upper.includes('НАЦЕНКА') ? '#E8720C' : color;
            popupContent += `<div class="popup-discount" style="color:${textColor}">${text}</div>`;
          } else {
            const priceTextColor = (color === '#84CC16') ? '#E8720C' : color;
            popupContent += `<div class="popup-price" style="color:${priceTextColor}">${price.price_value} ₽/л</div>`;
            if (station.market_price && !isNaN(station.market_price)) {
              const market = parseFloat(station.market_price);
              const diff = market - price.price_value;
              popupContent += `<div class="market-info">Средняя стела: ${market.toFixed(2)} ₽/л</div>`;
              if (diff > 0) {
                popupContent += `<div class="saving-info">Выгода: ${diff.toFixed(2)} ₽/л</div>`;
              }
            }
          }
        } else {
          popupContent += `<div class="popup-no-price" style="color:${color}">Цена не указана для ${currentFuel}</div>`;
        }

        if (station.region) {
          popupContent += `<div class="popup-region">Регион: ${station.region}</div>`;
        }

        marker.bindPopup(popupContent);
      });

      updateBestPriceBar();
      updateTopNetworksBar();

      if (!clientRouteGeojson && stations.length > 0) {
        const bounds = L.latLngBounds(
          stations.filter(s => s.lat && s.lon).map(s => [s.lat, s.lon])
        );
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    let networksData = {};

    function updateNetworkPanel(stations) {
      const byNetwork = {};
      stations.forEach(station => {
        const netName = station.network_name || 'Прочие';
        if (!byNetwork[netName]) {
          byNetwork[netName] = {
            name: netName,
            region: station.region || '',
            stations: [],
            minPrice: null,
            minPriceText: null,
            color: getMarkerColor(station, getPriceForFuel(station, currentFuel))
          };
        }
        const p = getPriceForFuel(station, currentFuel);
        if (p && !p.is_discount && p.price_value > 0) {
          if (byNetwork[netName].minPrice === null || p.price_value < byNetwork[netName].minPrice) {
            byNetwork[netName].minPrice = p.price_value;
          }
        } else if (p && p.is_discount) {
          if (byNetwork[netName].minPriceText === null) {
            byNetwork[netName].minPriceText = p.discount_text || 'условие';
          }
        }
        byNetwork[netName].stations.push(station);
      });

      const networkNames = Object.keys(byNetwork).sort((a, b) => {
        const A = byNetwork[a], B = byNetwork[b];
        if (A.minPrice !== null && B.minPrice !== null) return A.minPrice - B.minPrice;
        if (A.minPrice !== null) return -1;
        if (B.minPrice !== null) return 1;
        return a.localeCompare(b);
      });

      const cheapestNet = networkNames.length > 0 && byNetwork[networkNames[0]].minPrice !== null
        ? networkNames[0] : null;

      const listDiv = document.getElementById('network-list');
      let html = '';
      if (networkNames.length === 0) {
        html = '<div style="color:#888; text-align:center; padding:12px;">Нет станций с ценами</div>';
      } else {
        networkNames.forEach(netName => {
          const net = byNetwork[netName];
          const isCheapest = netName === cheapestNet;
          let priceLabel;
          let priceColor = '';
          if (net.minPrice !== null) {
            priceLabel = net.minPrice.toFixed(2) + ' ₽/л';
          } else if (net.minPriceText) {
            priceLabel = net.minPriceText;
            const upper = net.minPriceText.toUpperCase();
            priceColor = upper.includes('НАЦЕНКА') ? '#E8720C' : '#16A34A';
          } else {
            priceLabel = '—';
          }

          html += `<div class="network-item network-item-clickable ${isCheapest ? 'cheapest' : ''}" data-network="${encodeURIComponent(netName)}" onclick="toggleNetwork('${encodeURIComponent(netName)}')">
            <div>
              <span class="dot-indicator" style="background:${net.color}"></span>
              <span>${netName}</span>
              ${net.region ? `<span class="network-region">${net.region}</span>` : ''}
              <span class="network-arrow">▶</span>
            </div>
            <div class="network-price"${priceColor ? ` style="color:${priceColor};"` : ''}>${priceLabel}</div>
          </div>
          <div class="network-stations" id="netstations-${encodeURIComponent(netName)}"></div>`;
        });
      }
      listDiv.innerHTML = html;

      networksData = byNetwork;

      window._networkData = {
        nets: networkNames,
        details: Object.fromEntries(
          networkNames.map(n => [n, { price: byNetwork[n].minPrice || 0, count: byNetwork[n].stations.length }])
        ),
        routeName: clientMapTitle || 'Карта АЗС'
      };
    }

    function toggleNetwork(encodedName) {
      const netName = decodeURIComponent(encodedName);
      const el = document.querySelector(`.network-item[data-network="${encodedName}"]`);
      const listEl = document.getElementById(`netstations-${encodedName}`);
      if (!el || !listEl) return;

      const isExpanded = el.classList.contains('expanded');
      if (isExpanded) {
        el.classList.remove('expanded');
        listEl.classList.remove('expanded');
        return;
      }

      const net = networksData[netName];
      if (!net) return;
      const sortedStations = net.stations.slice().sort((a, b) => {
        const pa = getPriceForFuel(a, currentFuel);
        const pb = getPriceForFuel(b, currentFuel);
        const va = pa && !pa.is_discount ? pa.price_value : 99999;
        const vb = pb && !pb.is_discount ? pb.price_value : 99999;
        return va - vb;
      });

      let html = '';
      sortedStations.forEach(st => {
        const p = getPriceForFuel(st, currentFuel);
        let priceLine = '';
        if (p) {
          if (p.is_discount) {
            const upper = (p.discount_text || '').toUpperCase();
            const c = upper.includes('НАЦЕНКА') ? '#E8720C' : '#16A34A';
            priceLine = `<div class="station-row-price" style="color:${c};">${p.discount_text || 'условие'}</div>`;
          } else if (p.price_value) {
            priceLine = `<div class="station-row-price">${p.price_value.toFixed(2)} ₽/л</div>`;
          }
        }
        html += `<div class="station-row" onclick="focusStation('${st.id}')">
          <div class="station-row-name">${st.name || 'АЗС'}</div>
          <div class="station-row-addr">${st.address || ''}</div>
          ${priceLine}
        </div>`;
      });
      listEl.innerHTML = html || '<div style="padding:6px;color:#888;">Нет станций</div>';

      el.classList.add('expanded');
      listEl.classList.add('expanded');
    }

    function focusStation(stationId) {
      const st = allStations.find(s => s.id === stationId);
      if (!st || !st.lat || !st.lon) return;
      const latlng = [st.lat, st.lon];
      focusWithOffset(latlng);
      setTimeout(() => openPopupAt(latlng), 350);
    }

    function togglePanel() {
      const panel = document.getElementById('network-panel');
      if (!panel) return;
      panel.classList.toggle('collapsed');
    }

    function copyAddressById(stationId, btnEl) {
      const station = filteredStations.find(s => s.id === stationId);
      if (!station || !station.address) return;
      const text = station.address;

      const onDone = () => {
        if (btnEl) {
          const old = btnEl.textContent;
          btnEl.textContent = '✓';
          btnEl.style.color = '#16A34A';
          btnEl.style.borderColor = '#16A34A';
          setTimeout(() => {
            btnEl.textContent = old;
            btnEl.style.color = '';
            btnEl.style.borderColor = '';
          }, 1200);
        }
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onDone).catch(() => {
          fallbackCopyAddress(text, onDone);
        });
      } else {
        fallbackCopyAddress(text, onDone);
      }
    }

    function fallbackCopyAddress(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        if (cb) cb();
      } catch (e) {
        console.warn('Не удалось скопировать адрес:', e);
      }
      document.body.removeChild(ta);
    }

    window.downloadExcel = async function() {
      if (!window._networkData) return;

      const wb = new ExcelJS.Workbook();
      wb.creator = 'Карта АЗС';
      wb.created = new Date();

      const useRouteSheets = clientRoutes.length > 0 && currentView === 'route';

      if (useRouteSheets) {
        for (let i = 0; i < clientRoutes.length; i++) {
          const route = clientRoutes[i];
          const routeStations = allStations.filter(station => {
            if (!station.lat || !station.lon) return false;
            if (getPriceForFuel(station, currentFuel) === null) return false;
            try {
              const line = turf.lineString(route.geojson.coordinates);
              const dist = turf.pointToLineDistance(
                turf.point([station.lon, station.lat]),
                line,
                { units: 'kilometers' }
              );
              return dist <= (route.radius_km || 5);
            } catch (e) { return false; }
          });
          const safeSheetName = (route.name || `Маршрут ${i + 1}`)
            .replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 30);
          await addRouteSheet(wb, safeSheetName, routeStations);
        }
      } else {
        await addRouteSheet(wb, 'Вся сеть', filteredStations);
      }

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const safeName = (clientMapTitle || 'АЗС_маршрут')
        .replace(/[^\wа-яА-ЯёЁ\-]+/g, '_').slice(0, 40);
      a.download = `${safeName}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    async function addRouteSheet(wb, sheetName, stations) {
      const ws = wb.addWorksheet(sheetName, {
        pageSetup: { fitToPage: true, orientation: 'landscape' }
      });

      ws.columns = [
        { width: 30 }, { width: 42 }, { width: 20 }, { width: 22 }, { width: 16 }, { width: 16 }
      ];

      ws.mergeCells('A1:F1');
      const titleCell = ws.getCell('A1');
      titleCell.value = 'Коммерческое предложение';
      titleCell.font = { name: 'Arial', size: 18, bold: true, color: { argb: 'FFFFFFFF' } };
      titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
      titleCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8720C' } };
      ws.getRow(1).height = 36;

      let bestPrice = null;
      let sumPrice = 0;
      let countNumeric = 0;

      stations.forEach(station => {
        const p = getPriceForFuel(station, currentFuel);
        if (p && !p.is_discount && p.price_value > 0) {
          if (bestPrice === null || p.price_value < bestPrice) bestPrice = p.price_value;
          sumPrice += p.price_value;
          countNumeric++;
        }
      });
      const avgPrice = countNumeric > 0 ? (sumPrice / countNumeric) : null;

      const rowsInfo = [
        ['Маршрут:', sheetName],
        ['Дата:', new Date().toLocaleDateString('ru-RU')],
        ['Топливо:', currentFuel],
        ['Лучшая цена:', bestPrice !== null ? bestPrice.toFixed(2) + ' ₽/л' : '—'],
        ['Средняя цена:', avgPrice !== null ? avgPrice.toFixed(2) + ' ₽/л' : '—'],
        ['Всего АЗС:', stations.length]
      ];

      let rowIdx = 2;
      rowsInfo.forEach(([label, value]) => {
        const lc = ws.getCell(`A${rowIdx}`);
        lc.value = label;
        lc.font = { name: 'Arial', size: 12, bold: true, color: { argb: 'FF78716C' } };
        lc.alignment = { horizontal: 'left', vertical: 'middle' };

        const vc = ws.getCell(`B${rowIdx}`);
        vc.value = value;
        vc.font = { name: 'Arial', size: 12, color: { argb: 'FF1F1B16' } };
        vc.alignment = { horizontal: 'left', vertical: 'middle' };

        if (label === 'Лучшая цена:' && bestPrice !== null) {
          vc.font = { name: 'Arial', size: 13, bold: true, color: { argb: 'FF16A34A' } };
        }
        rowIdx++;
      });
      rowIdx++;

      const headerRowIdx = rowIdx;
      const headers = ['Название', 'Адрес', 'Сеть', 'Регион', 'Топливо', 'Цена'];
      headers.forEach((h, i) => {
        const cell = ws.getCell(headerRowIdx, i + 1);
        cell.value = h;
        cell.font = { name: 'Arial', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
        cell.alignment = { horizontal: 'left', vertical: 'middle' };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F1B16' } };
      });
      ws.getRow(headerRowIdx).height = 26;

      const sorted = stations.slice().sort((a, b) => {
        const pa = getPriceForFuel(a, currentFuel);
        const pb = getPriceForFuel(b, currentFuel);
        const va = pa && !pa.is_discount ? pa.price_value : 999999;
        const vb = pb && !pb.is_discount ? pb.price_value : 999999;
        return va - vb;
      });

      let dataRow = headerRowIdx + 1;
      sorted.forEach(station => {
        const p = getPriceForFuel(station, currentFuel);
        const name = station.name || '';
        const address = station.address || '';
        const network = station.network_name || '';
        const region = station.region || '';
        let priceText = '—';
        let priceColor = null;
        let rowFill = null;
        let isBestRow = false;

        if (p) {
          if (p.is_discount) {
            priceText = p.discount_text || 'условие';
            const upper = priceText.toUpperCase();
            priceColor = upper.includes('НАЦЕНКА') ? 'FFE8720C' : 'FF16A34A';
          } else if (p.price_value) {
            priceText = p.price_value.toFixed(2) + ' ₽/л';
            if (bestPrice !== null && Math.abs(p.price_value - bestPrice) < 0.001) {
              rowFill = 'FFE8F5E9';
              priceColor = 'FF16A34A';
              isBestRow = true;
            }
          }
        }

        ws.getRow(dataRow).height = 24;
        const cells = [
          { value: name, align: 'left' },
          { value: address, align: 'left' },
          { value: network, align: 'left' },
          { value: region, align: 'left' },
          { value: currentFuel, align: 'left' },
          { value: priceText, align: 'left', color: priceColor, bold: !!priceColor }
        ];

        cells.forEach((c, i) => {
          const cell = ws.getCell(dataRow, i + 1);
          cell.value = c.value;
          cell.alignment = { horizontal: c.align, vertical: 'middle', wrapText: false };
          cell.font = {
            name: 'Arial', size: 11,
            color: c.color ? { argb: c.color } : { argb: 'FF1F1B16' },
            bold: !!c.bold
          };
          if (rowFill) cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: rowFill } };
          if (isBestRow) {
            const b = { style: 'medium', color: { argb: 'FF16A34A' } };
            cell.border = { top: b, bottom: b, left: b, right: b };
          } else {
            cell.border = { bottom: { style: 'thin', color: { argb: 'FFE8E1D8' } } };
          }
        });
        dataRow++;
      });

      ws.views = [{ state: 'frozen', ySplit: headerRowIdx }];
    }

    function showGreeting(area, showGreetingFlag) {
      if (!showGreetingFlag) return;
      const greetingKey = 'greeting_shown_' + token;
      if (sessionStorage.getItem(greetingKey)) {
        const banner = document.getElementById('greeting-banner');
        banner.textContent = getGreetingMessage(area);
        banner.style.display = 'block';
        setTimeout(() => banner.style.display = 'none', 5000);
      } else {
        document.getElementById('greeting-text').textContent = getGreetingMessage(area);
        document.getElementById('greeting-overlay').style.display = 'flex';
        sessionStorage.setItem(greetingKey, 'true');
      }
    }

    function getGreetingMessage(area) {
      let bestPrice = null;
      let bestStation = null;
      allStations.forEach(station => {
        if (area && station.region && station.region.toLowerCase().indexOf(area.toLowerCase()) !== -1) {
          const price = getPriceForFuel(station, currentFuel);
          if (price && !price.is_discount && price.price_value > 0) {
            if (bestPrice === null || price.price_value < bestPrice) {
              bestPrice = price.price_value;
              bestStation = station;
            }
          }
        }
      });
      let msg = 'Предлагаем заправку по нашей партнёрской сети с оптовыми ценами.';
      if (bestStation) {
        msg += ` Лучшая цена в ${area}: ${bestPrice.toFixed(2)} ₽/л (${bestStation.name}).`;
      } else {
        msg += ' Цены действительны для всей России.';
      }
      return msg;
    }

    // Загрузка данных
    fetch(`${API_URL}?token=${token}`)
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
      })
      .then(data => {
        if (data.stations) {
          allStations = data.stations;
          const meta = data.meta || {};
          const area = meta.area || 'России';
          const showGreetingFlag = meta.show_greeting !== false;

          clientMapTitle = meta.map_title || null;
          clientRadiusKm = meta.radius_km || 5;
          
          clientExternalStations = Array.isArray(meta.external_stations)
            ? meta.external_stations
            : [];

          if (Array.isArray(meta.routes) && meta.routes.length > 0) {
            clientRoutes = meta.routes.map(r => ({
              id: r.id || String(Math.random()),
              name: r.name || 'Маршрут',
              geojson: r.geojson,
              radius_km: r.radius_km || 5
            }));
          } else if (meta.route_geojson && meta.route_geojson.coordinates) {
            clientRoutes = [{
              id: 'legacy',
              name: meta.map_title || 'Маршрут',
              geojson: meta.route_geojson,
              radius_km: meta.radius_km || 5
            }];
          } else {
            clientRoutes = [];
          }

          clientRouteGeojson = clientRoutes.length > 0 ? clientRoutes[0].geojson : null;
          activeRouteIndex = 0;

          // ВАЖНО: Сначала строим кнопки топлива, потом инициализируем фильтр
          buildFuelButtons();
          initFuelFilter();
          buildViewTabs();
          buildRoutesSwitcher();
          buildExternalSwitcher();
          drawClientRoutes();
          computeStationsOnRoute();
          showMapTitle();
          applyFilters();
          showGreeting(area, showGreetingFlag);
        } else {
          allStations = data;
          buildFuelButtons();
          initFuelFilter();
          applyFilters();
        }
      })
      .catch(async (error) => {
        console.error('Error fetching stations:', error);
        let message = 'Ошибка загрузки данных';
        try {
          const resp = await fetch(`${API_URL}?token=${token}`);
          const data = await resp.json();
          if (data && data.error) message = data.error;
        } catch (e) {}

        document.body.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:center; height:100vh; padding:20px; background: linear-gradient(135deg, #FAF6F1 0%, #FEF3E2 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
            <div style="background:#fff; padding:40px 32px; border-radius:18px; box-shadow: 0 8px 24px rgba(31,27,22,0.12); border: 1px solid #E8E1D8; text-align:center; max-width:420px;">
              <div style="font-size:56px; line-height:1; margin-bottom:16px;">🔒</div>
              <h2 style="color:#1F1B16; font-size:20px; margin:0 0 12px;">Ссылка недействительна</h2>
              <p style="color:#78716C; font-size:15px; margin:0; line-height:1.5;">${message}</p>
            </div>
          </div>
        `;
      });

    function computeStationsOnRoute() {
      if (!clientRouteGeojson || !clientRouteGeojson.coordinates) {
        stationsOnRoute = [];
        return;
      }
      try {
        const line = turf.lineString(clientRouteGeojson.coordinates);
        const radiusKm = clientRadiusKm || 5;
        stationsOnRoute = allStations.filter(station => {
          if (!station.lat || !station.lon) return false;
          const dist = turf.pointToLineDistance(
            turf.point([station.lon, station.lat]),
            line,
            { units: 'kilometers' }
          );
          return dist <= radiusKm;
        });
      } catch (e) {
        console.warn('Не удалось вычислить станции вдоль маршрута:', e);
        stationsOnRoute = [];
      }
    }

    function buildViewTabs() {
      const panel = document.querySelector('.control-panel');
      if (!panel) return;

      const old = document.getElementById('view-tabs');
      if (old) old.remove();

      const div = document.createElement('div');
      div.className = 'view-tabs';
      div.id = 'view-tabs';

      let html = '';
      if (clientRouteGeojson) {
        html += `<button class="view-tab active" data-view="route" onclick="switchView('route')">Мой маршрут</button>`;
      }
      html += `<button class="view-tab${!clientRouteGeojson ? ' active' : ''}" data-view="network" onclick="switchView('network')">Партнёрская сеть</button>`;
      if (clientExternalStations.length > 0) {
        html += `<button class="view-tab" data-view="external" onclick="switchView('external')">Другая сеть</button>`;
      }

      div.innerHTML = html;
      panel.insertBefore(div, panel.firstChild);

      if (!clientRouteGeojson) currentView = 'network';
    }

    function switchView(view) {
      if (view === currentView) return;
      currentView = view;

      document.querySelectorAll('.view-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.view === view);
      });

      if (view === 'route') {
        clientRouteLines.forEach(line => {
          if (!map.hasLayer(line)) line.addTo(map);
        });
      } else {
        clientRouteLines.forEach(line => {
          if (map.hasLayer(line)) map.removeLayer(line);
        });
      }

      const switcher = document.getElementById('routes-switcher');
      if (switcher) {
        switcher.style.display = (view === 'route' && clientRoutes.length > 1) ? 'flex' : 'none';
      }

      const extSwitcher = document.getElementById('external-switcher');
      if (extSwitcher) {
        extSwitcher.style.display = (view === 'external') ? 'flex' : 'none';
      }

      const fuelFilter = document.getElementById('fuel-filter-wrapper');
      if (fuelFilter) {
        fuelFilter.style.display = (view === 'external') ? 'none' : '';
      }

      if (view === 'external') {
        drawExternalStations();
      } else {
        hideExternalStations();
        hideExternalFilterPanel();
      }

      applyFilters();
    }

    const ROUTE_COLORS = ['#1565C0', '#E8720C', '#16A34A', '#8E24AA', '#0288D1', '#D81B60'];

    function drawClientRoutes() {
      clientRouteLines.forEach(l => { try { map.removeLayer(l); } catch (e) {} });
      clientRouteLines = [];

      if (!clientRoutes || clientRoutes.length === 0) return;

      clientRoutes.forEach((route, idx) => {
        if (!route.geojson || !route.geojson.coordinates) return;
        const latlngs = route.geojson.coordinates.map(c => [c[1], c[0]]);
        const isActive = idx === activeRouteIndex;
        const color = ROUTE_COLORS[idx % ROUTE_COLORS.length];

        const line = L.polyline(latlngs, {
          color: isActive ? color : '#9E9E9E',
          weight: isActive ? 5 : 3,
          opacity: isActive ? 0.9 : 0.4,
          dashArray: isActive ? null : '6,6'
        }).addTo(map);

        line.on('click', () => setActiveRoute(idx));

        clientRouteLines.push(line);
      });

      if (clientRouteLines[activeRouteIndex]) {
        map.fitBounds(clientRouteLines[activeRouteIndex].getBounds(), { padding: [50, 50] });
      }
    }

    function setActiveRoute(idx) {
      if (idx < 0 || idx >= clientRoutes.length) return;
      activeRouteIndex = idx;

      clientRouteGeojson = clientRoutes[idx].geojson;
      clientRadiusKm = clientRoutes[idx].radius_km || 5;

      clientRoutes.forEach((route, i) => {
        const line = clientRouteLines[i];
        if (!line) return;
        const isActive = i === activeRouteIndex;
        const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
        line.setStyle({
          color: isActive ? color : '#9E9E9E',
          weight: isActive ? 5 : 3,
          opacity: isActive ? 0.9 : 0.4,
          dashArray: isActive ? null : '6,6'
        });
      });

      computeStationsOnRoute();
      const routeName = clientRoutes[idx].name || 'Маршрут';
      updateMapTitleText(routeName);

      document.querySelectorAll('.route-switch-btn').forEach((b, i) => {
        b.classList.toggle('active', i === idx);
      });

      applyFilters();
    }

    function updateMapTitleText(text) {
      const el = document.getElementById('map-title');
      if (el) el.textContent = text;
    }

    function drawExternalStations() {
      hideExternalStations();

      let stations;
      if (currentExternalNetwork === '__all__') {
        const enabled = getEnabledExternalNetworks();
        stations = clientExternalStations.filter(s => enabled.includes(s.network_name));
        showExternalFilterPanel();
      } else {
        stations = clientExternalStations.filter(s => s.network_name === currentExternalNetwork);
        hideExternalFilterPanel();
      }

      if (stations.length === 0) return;

      const colorFor = (netName) => externalColors[netName] || '#888888';
      const uniqueNets = new Set(stations.map(s => s.network_name));
      const clusterColor = uniqueNets.size === 1 ? colorFor([...uniqueNets][0]) : '#607D8B';

      externalLayer = L.markerClusterGroup({
        maxClusterRadius: 35,
        showCoverageOnHover: false,
        spiderfyOnMaxZoom: true,
        disableClusteringAtZoom: 11,
        iconCreateFunction: function (cluster) {
          const count = cluster.getChildCount();
          return L.divIcon({
            html: `<div style="background:${clusterColor};color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.25);">${count}</div>`,
            className: '',
            iconSize: [42, 42],
          });
        },
      });

      stations.forEach(s => {
        if (!s.lat || !s.lon) return;
        const color = colorFor(s.network_name);
        const marker = L.circleMarker([s.lat, s.lon], {
          radius: 10, fillColor: color, color: '#fff', weight: 2.5, fillOpacity: 0.95,
        });
        const popup = `
          <b>${s.name || (s.station_number ? 'АЗС №' + s.station_number : 'АЗС')}</b>
          <div style="font-size:11.5px; color:#666; margin-top:2px;">${s.network_name}</div>
          ${s.address ? `<div class="popup-address-row"><span>${s.address}</span><button class="copy-addr-btn" onclick="copyExternalAddress('${s.id}', this)" title="Скопировать">📋</button></div>` : ''}
          ${s.station_number ? `<div style="font-size:12px; color:#888;">№ АЗС: ${s.station_number}</div>` : ''}
        `;
        marker.bindPopup(popup);
        externalLayer.addLayer(marker);
      });

      externalLayer.addTo(map);
    }

    function hideExternalStations() {
      if (externalLayer && map.hasLayer(externalLayer)) {
        map.removeLayer(externalLayer);
      }
      externalLayer = null;
    }

    function getEnabledExternalNetworks() {
      const checkboxes = document.querySelectorAll('.external-filter-checkbox');
      if (checkboxes.length === 0) {
        const all = Array.from(new Set(clientExternalStations.map(s => s.network_name)));
        return all;
      }
      return Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
    }

    function showExternalFilterPanel() {
      const panel = document.getElementById('external-filter-panel');
      const list = document.getElementById('external-filter-list');
      if (!panel || !list) return;

      if (list.children.length === 0) {
        const allNets = Array.from(new Set(clientExternalStations.map(s => s.network_name)));
        allNets.sort();
        list.innerHTML = '';
        allNets.forEach(name => {
          const label = document.createElement('label');
          label.className = 'external-filter-item';
          const cb = document.createElement('input');
          cb.type = 'checkbox'; cb.value = name; cb.className = 'external-filter-checkbox'; cb.checked = true;
          cb.addEventListener('change', () => { drawExternalStations(); });
          label.appendChild(cb);
          const dot = document.createElement('span');
          dot.className = 'external-filter-dot'; dot.style.background = externalColors[name] || '#888888';
          label.appendChild(dot);
          const span = document.createElement('span');
          span.textContent = name;
          label.appendChild(span);
          list.appendChild(label);
        });
      }
      panel.style.display = 'block';
    }

    function hideExternalFilterPanel() {
      const panel = document.getElementById('external-filter-panel');
      if (panel) panel.style.display = 'none';
    }

    function copyExternalAddress(id, btnEl) {
      const s = clientExternalStations.find(x => x.id === id);
      if (!s || !s.address) return;
      const text = s.address;
      const onDone = () => {
        if (btnEl) {
          const old = btnEl.textContent;
          btnEl.textContent = '✓';
          setTimeout(() => { btnEl.textContent = old; }, 1200);
        }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onDone).catch(() => {});
      }
    }

    function buildExternalSwitcher() {
      const panel = document.querySelector('.control-panel');
      if (!panel) return;

      const old = document.getElementById('external-switcher');
      if (old) old.remove();

      if (clientExternalStations.length === 0) return;

      const networks = Array.from(new Set(clientExternalStations.map(s => s.network_name)));
      if (networks.length === 0) return;

      if (networks.length > 1) {
        currentExternalNetwork = '__all__';
      } else {
        currentExternalNetwork = networks[0];
      }

      const div = document.createElement('div');
      div.className = 'external-switcher';
      div.id = 'external-switcher';
      div.style.display = 'none';

      if (networks.length > 1) {
        const allBtn = document.createElement('button');
        allBtn.className = 'external-switch-btn active';
        allBtn.textContent = 'Все сети';
        allBtn.dataset.net = '__all__';
        allBtn.onclick = () => {
          currentExternalNetwork = '__all__';
          updateExternalSwitcherActive();
          if (currentView === 'external') drawExternalStations();
        };
        div.appendChild(allBtn);
      }

      networks.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'external-switch-btn' + ((currentExternalNetwork === name) ? ' active' : '');
        btn.textContent = name;
        btn.dataset.net = name;
        btn.onclick = () => {
          currentExternalNetwork = name;
          updateExternalSwitcherActive();
          if (currentView === 'external') drawExternalStations();
        };
        div.appendChild(btn);
      });

      panel.appendChild(div);
    }

    function updateExternalSwitcherActive() {
      document.querySelectorAll('.external-switch-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.net === currentExternalNetwork);
      });
    }

    function buildRoutesSwitcher() {
      const panel = document.querySelector('.control-panel');
      if (!panel) return;

      const old = document.getElementById('routes-switcher');
      if (old) old.remove();

      if (clientRoutes.length <= 1) return;

      const div = document.createElement('div');
      div.className = 'routes-switcher';
      div.id = 'routes-switcher';

      clientRoutes.forEach((r, i) => {
        const btn = document.createElement('button');
        btn.className = 'route-switch-btn' + (i === 0 ? ' active' : '');
        btn.textContent = r.name;
        btn.title = r.name;
        btn.onclick = () => setActiveRoute(i);
        div.appendChild(btn);
      });

      div.style.display = (currentView === 'route') ? 'flex' : 'none';
      panel.insertBefore(div, panel.firstChild);
    }

    function showMapTitle() {
      if (!clientMapTitle) return;

      const panel = document.querySelector('.control-panel');
      if (!panel) return;

      const old = document.getElementById('map-title');
      if (old) old.remove();

      const div = document.createElement('div');
      div.id = 'map-title';
      div.style.cssText = 'flex-basis:100%; text-align:center; margin-bottom:4px;';
      div.textContent = clientMapTitle;

      panel.insertBefore(div, panel.firstChild);
    }

    window.addEventListener('resize', () => {
      updateBestPriceBar();
      updateTopNetworksBar();
    });
  </script>
</body>
</html>
