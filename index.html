<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта АЗС</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
    /* ============================================================
       Шаг 16.3. Тёплая палитра клиентской карты.
       ============================================================ */
  
    :root {
      --bg: #FAF6F1;
      --surface: #FFFFFF;
      --surface-glass: rgba(255, 255, 255, 0.92);
      --border: #E8E1D8;
      --text: #1F1B16;
      --text-muted: #78716C;
      --accent: #E8720C;
      --accent-hover: #C75F00;
      --success: #16A34A;
      --danger: #DC2626;
      --warn: #D97706;
      --warn-bg: #FEF3E2;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --shadow-soft: 0 2px 8px rgba(31, 27, 22, 0.08);
      --shadow-card: 0 8px 24px rgba(31, 27, 22, 0.12);
      --gradient-accent: linear-gradient(135deg, #F59E0B 0%, #E8720C 100%);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      line-height: 1.5;
    }
    #map { height: 100vh; width: 100%; }

      .leaflet-control-attribution {
  display: none !important;
   }
    /* ---------- Верхняя панель управления ---------- */
    .control-panel {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 14px;
      border-radius: 999px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      max-width: calc(100% - 28px);
    }
    /* ---------- Вкладки «Вся сеть / Мой маршрут» ---------- */
    .view-tabs {
      display: flex;
      gap: 4px;
      padding: 3px;
      background: rgba(232, 225, 216, 0.5);
      border-radius: 999px;
      flex-basis: 100%;
      justify-content: center;
      margin-bottom: 6px;
    }
    .view-tab {
      padding: 7px 16px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .18s, color .18s, box-shadow .18s;
      white-space: nowrap;
    }
    .view-tab:hover {
      background: rgba(255, 255, 255, 0.7);
      color: var(--text);
    }
    .view-tab.active {
      background: var(--gradient-accent);
      color: #fff;
      box-shadow: 0 3px 10px rgba(232, 114, 12, 0.3);
    }
    @media (max-width: 720px) {
      .view-tab { padding: 6px 12px; font-size: 12px; }
    }
    /* Кнопки топлива */
    .fuel-btn, .route-btn {
      padding: 8px 16px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      transition: background .18s, color .18s, transform .12s, box-shadow .18s;
    }
    .fuel-btn:hover, .route-btn:hover {
      background: rgba(232, 114, 12, 0.10);
      color: var(--accent);
    }
    .fuel-btn.active, .route-btn.active {
      background: var(--gradient-accent);
      color: #fff;
      box-shadow: 0 3px 10px rgba(232, 114, 12, 0.32);
    }

    /* Заголовок карты в панели */
    #map-title {
      color: var(--text) !important;
      font-weight: 700 !important;
      font-size: 14px !important;
      letter-spacing: -0.01em;
    }

    /* ---------- Popup цены ---------- */
    .leaflet-popup-content-wrapper {
      border-radius: var(--radius-md) !important;
      box-shadow: var(--shadow-card) !important;
      border: 1px solid var(--border);
    }
    .leaflet-popup-content {
      margin: 14px 16px !important;
      font-size: 13.5px !important;
      line-height: 1.55 !important;
      color: var(--text) !important;
    }
    .leaflet-popup-tip {
      box-shadow: none !important;
    }
          /* ---------- Звезда для лучшей цены ---------- */
    .best-price-marker {
      font-size: 28px;
      line-height: 28px;
      text-align: center;
      color: #16A34A;
      text-shadow:
        0 0 0 #fff,
        1px 1px 0 #fff,
        -1px -1px 0 #fff,
        1px -1px 0 #fff,
        -1px 1px 0 #fff,
        0 2px 6px rgba(0,0,0,0.35);
      font-family: Arial, sans-serif;
      font-weight: 900;
      pointer-events: auto;
      cursor: pointer;
      transition: transform .15s;
    }
    .best-price-marker:hover { transform: scale(1.15); }

    /* ---------- Нижняя строка «Лучшая цена» ---------- */
    #best-price-bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 1500;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(31, 27, 22, 0.14);
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      white-space: nowrap;
      max-width: calc(100% - 28px);
    }
    #best-price-bar.visible { display: flex; }
    #best-price-bar .star {
      color: #16A34A;
      font-size: 18px;
      line-height: 1;
    }
    #best-price-bar .label {
      color: var(--text-muted);
      font-weight: 500;
    }
    #best-price-bar .value {
      color: #16A34A;
      font-weight: 700;
      font-size: 16px;
    }
    #best-price-bar .network {
      color: var(--text);
      font-weight: 600;
    }
    #best-price-bar .show-btn {
      padding: 7px 14px;
      background: var(--gradient-accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(232, 114, 12, 0.3);
      transition: transform .12s, box-shadow .18s;
      margin: 0;
    }
    #best-price-bar .show-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(232, 114, 12, 0.4);
    }

    @media (max-width: 720px) {
      #best-price-bar {
        font-size: 12.5px;
        padding: 8px 12px;
        gap: 8px;
        bottom: 10px;
      }
      #best-price-bar .value { font-size: 14px; }
      #best-price-bar .show-btn { padding: 6px 10px; font-size: 12px; }
    }
        .popup-price {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 8px;
      display: block;
    }
    .popup-address-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .copy-addr-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      line-height: 1;
      margin: 0;
      box-shadow: none;
      transition: background .15s, color .15s, border-color .15s;
      flex-shrink: 0;
    }
    .copy-addr-btn:hover {
      background: var(--warn-bg);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: none;
      transform: none;
    }

    .popup-region {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .popup-discount {
      margin-top: 8px;
      color: var(--danger);
      font-weight: 700;
    }

    .popup-no-price {
      margin-top: 8px;
      color: var(--text-muted);
      font-style: italic;
    }
    .market-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .saving-info {
      font-size: 13px;
      color: var(--success);
      font-weight: 700;
      margin-top: 4px;
      background: #ECFDF5;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }
    /* ---------- Раскрывающиеся сети и сворачивание панели ---------- */
    .network-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .network-header h4 {
      margin: 0;
    }
    .panel-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: none; /* видно только на мобильной */
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      line-height: 1;
      transition: background .15s, color .15s;
    }
    .panel-toggle:hover {
      background: var(--warn-bg);
      color: var(--accent);
    }

    /* Раскрывающаяся сеть */
    .network-item-clickable {
      cursor: pointer;
      user-select: none;
    }
    .network-item-clickable .network-arrow {
      display: inline-block;
      margin-left: 6px;
      transition: transform .2s;
      color: var(--text-muted);
      font-size: 10px;
    }
    .network-item-clickable.expanded .network-arrow {
      transform: rotate(90deg);
    }
    .network-item.cheapest {
      background: linear-gradient(135deg, rgba(22, 163, 74, 0.15) 0%, rgba(22, 163, 74, 0.06) 100%);
      border: 1px solid rgba(22, 163, 74, 0.35);
      border-radius: 8px;
      margin: 4px 0;
      padding-left: 8px;
      padding-right: 8px;
    }
    .network-item.cheapest .network-price {
      color: #16A34A;
      font-size: 15px;
    }
    .network-price {
      font-weight: 700;
      color: var(--text);
    }
    .network-region {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Список АЗС внутри сети */
    .network-stations {
      display: none;
      padding: 4px 8px 8px 24px;
      background: rgba(250, 246, 241, 0.5);
      border-radius: 8px;
      margin-top: 2px;
    }
    .network-stations.expanded {
      display: block;
    }
    .station-row {
      padding: 8px 6px;
      border-bottom: 1px solid rgba(232, 225, 216, 0.6);
      cursor: pointer;
      transition: background .15s;
      border-radius: 6px;
    }
    .station-row:last-child {
      border-bottom: none;
    }
    .station-row:hover {
      background: rgba(255, 255, 255, 0.8);
    }
    .station-row-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .station-row-addr {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .station-row-price {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }

    /* Свёрнутая панель на мобильной */
    @media (max-width: 820px) {
      .panel-toggle {
        display: inline-flex;
      }
      .network-panel.collapsed {
        max-height: 52px;
        overflow: hidden;
      }
      .network-panel.collapsed .network-header {
        margin-bottom: 0;
      }
      .network-panel.collapsed .network-list,
      .network-panel.collapsed .download-btn {
        display: none;
      }
      .network-panel.collapsed .panel-toggle {
        transform: rotate(180deg);
      }
    }
    /* ---------- Правая панель сетей ---------- */
    .network-panel {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      z-index: 1001;
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 16px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      max-width: 280px;
      display: none;
      font-size: 13px;
    }
    .network-panel h4 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .network-list {
      max-height: 320px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .network-list::-webkit-scrollbar { width: 6px; }
    .network-list::-webkit-scrollbar-thumb {
      background: #D6CFC7; border-radius: 3px;
    }
    .network-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 6px;
      border-bottom: 1px solid #F1EBE3;
      align-items: center;
      gap: 8px;
    }
    .network-item:last-child { border-bottom: none; }
    .network-item.opt {
      background: rgba(236, 253, 245, 0.7);
      border-radius: 6px;
      margin: 2px 0;
      border-bottom: none;
    }
    .network-item.best {
      background: rgba(254, 243, 226, 0.7);
      border-radius: 6px;
      margin: 2px 0;
      border-bottom: none;
    }
    .dot-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      display: inline-block;
      vertical-align: middle;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(31,27,22,0.08);
    }

    /* Кнопка Excel */
    .download-btn {
      display: block;
      margin-top: 14px;
      padding: 10px 14px;
      background: var(--gradient-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      width: 100%;
      font-size: 13.5px;
      font-weight: 700;
      font-family: inherit;
      box-shadow: 0 3px 10px rgba(232, 114, 12, 0.28);
      transition: transform .12s, box-shadow .18s, filter .18s;
    }
    .download-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(232, 114, 12, 0.35);
      filter: brightness(1.03);
    }

    /* ---------- Приветствие ---------- */
    .greeting-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(31, 27, 22, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .greeting-modal {
      background: var(--surface);
      padding: 32px 28px;
      border-radius: var(--radius-lg);
      text-align: center;
      max-width: 420px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      animation: popIn .28s ease;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }
    .greeting-modal h2 {
      margin: 10px 0 12px;
      font-size: 20px;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .greeting-modal p {
      margin: 0 0 20px;
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.55;
    }
    .greeting-modal button {
      margin-top: 4px;
      padding: 11px 28px;
      background: var(--gradient-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(232, 114, 12, 0.3);
      transition: transform .12s, box-shadow .18s, filter .18s;
      font-family: inherit;
    }
    .greeting-modal button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(232, 114, 12, 0.38);
      filter: brightness(1.03);
    }
    .greeting-banner {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10001;
      background: var(--text);
      color: #F5F0E8;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-card);
      display: none;
      max-width: 320px;
    }

    /* ---------- Ссылка на Яндекс.Карты ---------- */
    #yandex-link-container a {
      background: var(--surface-glass) !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 16px !important;
      border-radius: 999px !important;
      box-shadow: var(--shadow-soft) !important;
      border: 1px solid var(--border);
      color: var(--text) !important;
      font-weight: 600;
      font-size: 13px;
      text-decoration: none !important;
      transition: transform .12s, box-shadow .18s, color .18s;
    }
    #yandex-link-container a:hover {
      color: var(--accent) !important;
      transform: translateY(-1px);
      box-shadow: var(--shadow-card) !important;
    }

    /* ---------- Адаптивность ---------- */
        /* ============================================================
       Шаг 16.4. Мобильная адаптация
       ============================================================ */
    @media (max-width: 820px) {
      /* Верхняя панель — компактная, кнопки горизонтальным скроллом. */
      .control-panel {
        padding: 6px 8px;
        gap: 0;
        max-width: calc(100% - 16px);
        top: 8px;
        border-radius: var(--radius-md);
        flex-wrap: nowrap;
        overflow: hidden;
        justify-content: flex-start;
      }
      #fuel-panel {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        padding: 2px;
        flex: 1;
      }
      #fuel-panel::-webkit-scrollbar { display: none; }

      .fuel-btn, .route-btn {
        padding: 9px 14px;
        font-size: 13px;
        min-height: 38px;
        flex-shrink: 0;
        min-width: 54px;
      }

      #map-title {
        font-size: 12px !important;
        flex-basis: 100%;
        text-align: center;
        padding: 0 4px 2px;
        line-height: 1.3;
        color: var(--text-muted) !important;
      }

      /* Popup крупнее — читать удобно. */
      .leaflet-popup-content {
        margin: 14px 16px !important;
        font-size: 14.5px !important;
        line-height: 1.6 !important;
      }
      .popup-price { font-size: 20px; }
      .copy-addr-btn {
        padding: 6px 10px;
        font-size: 14px;
        min-height: 32px;
        min-width: 32px;
      }

      /* Панель сетей — выдвигается снизу, скруглённая сверху. */
           .network-panel {
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        transform: none;
        max-width: none;
        max-height: 50vh;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        border-bottom: none;
        padding: 14px 16px;
        padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      }
      .network-panel h4 {
        font-size: 15px;
        text-align: center;
        position: relative;
        padding-top: 4px;
      }
      .network-panel h4::before {
        content: '';
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 4px;
        background: #D6CFC7;
        border-radius: 2px;
      }
      .network-list { max-height: 32vh; }

           /* Кнопка Excel — внутри панели, прижата к её низу.
         Панель сама у нижнего края экрана, значит кнопка — внизу. */
      .download-btn {
        width: 100%;
        padding: 12px 16px;
        font-size: 14px;
        border-radius: var(--radius-sm);
        margin-top: 12px;
        box-shadow: 0 3px 10px rgba(232, 114, 12, 0.3);
      }

      /* Модалка приветствия. */
      .greeting-modal {
        padding: 24px 20px;
        max-width: 92vw;
      }
      .greeting-modal h2 { font-size: 18px; }
      .greeting-modal button { width: 100%; }

      /* Баннер приветствия во всю ширину снизу. */
      .greeting-banner {
        top: auto;
        bottom: 14px;
        right: 14px;
        left: 14px;
        max-width: none;
      }

      /* Ссылка на Яндекс.Карты — плавающая слева снизу. */
      #yandex-link-container {
        bottom: 14px !important;
        left: 14px !important;
      }
      #yandex-link-container a {
        padding: 12px 16px !important;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="control-panel">
    <div id="fuel-panel"></div>
  </div>
  <div id="map"></div>
    <div class="network-panel" id="network-panel">
    <div class="network-header">
      <h4>АЗС на маршруте</h4>
      <button class="panel-toggle" onclick="togglePanel()" title="Свернуть">▼</button>
    </div>
    <div class="network-list" id="network-list"></div>
    <button class="download-btn" onclick="downloadExcel()">📥 Скачать Excel</button>
  </div>
  <div id="yandex-link-container" style="display:none; position:absolute; bottom: 10px; left: 10px; z-index: 1000;">
    <a id="yandex-link" href="#" target="_blank" style="background: #fff; padding: 8px 12px; border-radius: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); text-decoration: none; color: #000;">Открыть в Яндекс.Картах</a>
  </div>
  <div id="greeting-overlay" class="greeting-overlay" style="display:none;">
    <div class="greeting-modal">

  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (!token) {
      document.body.innerHTML = '<h2 style="text-align:center;margin-top:50px;">Не указан токен</h2>';
      throw new Error('Token missing');
    }

    const API_URL = 'https://cbctbbaekgmsogfxpvoy.supabase.co/functions/v1/quick-service';
    const GH_API_KEY = 'a4b49645-1e81-4a2e-a019-741d76b2903c'; // замените при необходимости

    // Инициализация Leaflet
    const map = L.map('map', { attributionControl: false }).setView([55.75, 37.62], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: 'OSM'
    }).addTo(map);

    let allStations = [];
    let currentFuel = 'ДТ-Л';
    let markersLayer = L.layerGroup().addTo(map);
    let routeLine = null;
    let filteredStations = [];

    // Текущий вид карты: 'route' (только маршрут) или 'network' (вся сеть).
    // По умолчанию — маршрут, если он есть. Меняется кнопками сверху.
    let currentView = 'route';

    // Слой станций вдоль маршрута. Заполняется при построении карты в конструкторе.
    // Если маршрута нет — пустой массив, и все станции показываются всегда.
    let stationsOnRoute = [];
    // Новое: данные, приходящие из meta от quick-service
    let clientRouteGeojson = null;   // геометрия маршрута от менеджера
    let clientMapTitle = null;       // заголовок карты
    let clientRadiusKm = 5;          // радиус, с которым строился маршрут
    let clientRouteLine = null;      // слой Leaflet с линией маршрута

    const highwayRoutes = {
      m10: { name: "Москва – Санкт‑Петербург (М10)", coords: [[37.5634,55.7756],[35.9176,56.8587],[34.9604,57.0411],[33.2486,57.9797],[31.2749,58.5228],[30.5043,59.8066]], radius: 5 },
      m4:  { name: "Москва – Краснодар (М4)", coords: [[37.6073,55.5796],[39.1844,51.6720],[39.7187,47.2225],[38.9753,45.0355]], radius: 5 },
      m5:  { name: "Москва – Владивосток (М5)", coords: [[37.7145,55.5854],[39.6916,54.6269],[45.0184,53.1959],[50.1002,53.1959],[55.9578,54.7348],[61.4368,55.1644],[65.3053,55.4649],[73.3682,54.9893],[82.9357,55.0084],[92.8526,56.0105],[104.2807,52.2864],[107.5842,51.8335],[113.4994,52.0340],[119.7308,53.7574],[127.2411,52.4493],[127.5274,50.2525],[135.0718,48.4802],[131.8855,43.1155]], radius: 5 },
      m7:  { name: "Москва – Владивосток (М7)", coords: [[37.6252,55.7530],[40.3966,56.1365],[43.9361,56.2965],[49.1233,55.7879],[56.2502,58.0105],[60.6057,56.8389],[65.5272,57.1522],[73.3682,54.9893],[82.9357,55.0084],[92.8526,56.0105],[104.2807,52.2864],[107.5842,51.8335],[113.4994,52.0340],[119.7308,53.7574],[127.2411,52.4493],[127.5274,50.2525],[135.0718,48.4802],[131.8855,43.1155]], radius: 5 }
    };

    function buildFuelButtons() {
      const fuels = ['ДТ-Л', 'ДТ-Е', 'ДТ-З', 'Газ'];
      const container = document.getElementById('fuel-panel');
      container.innerHTML = '';
      fuels.forEach(fuel => {
        const btn = document.createElement('button');
        btn.className = 'fuel-btn' + (fuel === currentFuel ? ' active' : '');
        btn.textContent = fuel;
        btn.dataset.fuel = fuel;
        btn.addEventListener('click', function() {
          document.querySelectorAll('.fuel-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentFuel = this.dataset.fuel;
          applyFilters();
        });
        container.appendChild(btn);
      });
    }

    function buildRouteButtons() {
      const container = document.getElementById('route-panel');
      container.innerHTML = '<span style="font-size:12px;margin-right:4px;">Маршрут:</span>';
      const allBtn = document.createElement('button');
      allBtn.className = 'route-btn active';
      allBtn.textContent = 'Все';
      allBtn.dataset.route = '';
      allBtn.addEventListener('click', function() {
        document.querySelectorAll('.route-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentRoute = null;
        applyFilters();
      });
      container.appendChild(allBtn);

      Object.keys(highwayRoutes).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'route-btn';
        btn.textContent = key.toUpperCase();
        btn.dataset.route = key;
        btn.addEventListener('click', function() {
          document.querySelectorAll('.route-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentRoute = highwayRoutes[key];
          applyFilters();
        });
        container.appendChild(btn);
      });
    }

    function getPriceForFuel(station, fuel) {
      if (!station.prices || station.prices.length === 0) return null;
      return station.prices.find(p => p.fuel_type === fuel) || null;
    }

            function getMarkerColor(station, price) {
      // Явно заданные цвета сетей в админке.
      if (station.color_code === 1) return '#43A047'; // зелёный
      if (station.color_code === 2) return '#FF9800'; // оранжевый
      if (station.color_code === 3) return '#1E88E5'; // синий

      // Нет цены — синий.
      if (!price) return '#1E88E5';

      // Газовая станция без своей цены — синий.
      if (currentFuel === 'Газ') return '#1E88E5';

      // Текстовая цена (скидка или наценка) — цвет по слову в тексте.
      if (price.is_discount) {
        const text = (price.discount_text || '').toUpperCase();
        if (text.includes('НАЦЕНКА')) return '#FF9800'; // оранжевый
        return '#43A047'; // зелёный (скидка по умолчанию)
      }

      // Числовая цена: градация относительно средней.
      const validPrices = filteredStations
        .map(s => getPriceForFuel(s, currentFuel))
        .filter(p => p && !p.is_discount && p.price_value > 0)
        .map(p => p.price_value);

      if (validPrices.length === 0) return '#1E88E5';

      const avg = validPrices.reduce((sum, v) => sum + v, 0) / validPrices.length;
      if (price.price_value < avg) return '#43A047'; // зелёный — дешевле среднего
      return '#FF9800'; // оранжевый — средняя и дороже
    }
        function applyFilters() {
      // Определяем базовый набор станций в зависимости от активной вкладки.
      let baseStations;
      if (clientRouteGeojson && currentView === 'route') {
        // Вкладка «Мой маршрут» — только станции вдоль маршрута.
        baseStations = stationsOnRoute;
      } else {
        // Вкладка «Вся сеть» или маршрута нет — все станции.
        baseStations = allStations;
      }

      // Фильтруем по топливу.
      const stations = baseStations.filter(
        station => getPriceForFuel(station, currentFuel) !== null
      );
      filteredStations = stations;
      displayStations(stations);

      // Панель сетей справа показываем только на вкладке «Мой маршрут».
      if (clientRouteGeojson && currentView === 'route') {
        updateNetworkPanel(stations);
        document.getElementById('network-panel').style.display = 'block';
        document.body.classList.add('has-network-panel');
      } else {
        document.getElementById('network-panel').style.display = 'none';
        document.body.classList.remove('has-network-panel');
      }
    }

            // Хранит данные о лучшей цене, чтобы кнопка «Показать» знала, куда лететь.
    let bestPriceStation = null;
    let bestPriceValue = null;

    function displayStations(stations) {
      markersLayer.clearLayers();
      bestPriceStation = null;
      bestPriceValue = null;

      // Находим станцию с самой низкой числовой ценой.
      stations.forEach(station => {
        const p = getPriceForFuel(station, currentFuel);
        if (p && !p.is_discount && p.price_value > 0) {
          if (bestPriceValue === null || p.price_value < bestPriceValue) {
            bestPriceValue = p.price_value;
            bestPriceStation = station;
          }
        }
      });

      stations.forEach(station => {
        const price = getPriceForFuel(station, currentFuel);
        const color = getMarkerColor(station, price);

        let marker;
        const isBest = bestPriceStation && station.id === bestPriceStation.id;

        if (isBest) {
          // Лучшая цена — зелёная звезда.
          const icon = L.divIcon({
            className: '',
            html: '<div class="best-price-marker">★</div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14],
            popupAnchor: [0, -14]
          });
          marker = L.marker([station.lat, station.lon], { icon }).addTo(markersLayer);
        } else {
          marker = L.circleMarker([station.lat, station.lon], {
            radius: 8,
            fillColor: color,
            color: '#fff',
            weight: 2,
            fillOpacity: 0.9
          }).addTo(markersLayer);
        }

               let popupContent = `<b>${station.name || 'АЗС'}</b>`;

        // Адрес + кнопка «копировать».
        if (station.address) {
          popupContent += `<div class="popup-address-row">`;
          popupContent += `<span>${station.address}</span>`;
          popupContent += `<button class="copy-addr-btn" title="Скопировать адрес" onclick="copyAddressById('${station.id}', this)">📋</button>`;
          popupContent += `</div>`;
        }

                // Цена — отдельным блоком, цвет берётся от маркера.
                // Цена — отдельным блоком, цвет берётся от маркера.
        if (price) {
          if (price.is_discount) {
            // Текстовая цена: префикс «Скидка:» убран, цвет по слову в тексте.
            const text = (price.discount_text || 'уточняйте');
            popupContent += `<div class="popup-discount" style="color:${color}">${text}</div>`;
          } else {
            popupContent += `<div class="popup-price" style="color:${color}">${price.price_value} ₽/л</div>`;
            if (station.market_price && !isNaN(station.market_price)) {
              const market = parseFloat(station.market_price);
              const diff = market - price.price_value;
              popupContent += `<div class="market-info">Средняя стела: ${market.toFixed(2)} ₽/л</div>`;
              if (diff > 0) {
                popupContent += `<div class="saving-info">Выгода: ${diff.toFixed(2)} ₽/л</div>`;
              }
            }
          }
        } else {
          popupContent += `<div class="popup-no-price" style="color:${color}">Цена не указана для ${currentFuel}</div>`;
        }

        // Регион — отдельной строкой с отступом.
        if (station.region) {
          popupContent += `<div class="popup-region">Регион: ${station.region}</div>`;
        }

        marker.bindPopup(popupContent);
      });

            // fitBounds делаем только если нет маршрута — иначе карта уже подстроена
      // под маршрут в drawClientRoute().
      if (!clientRouteGeojson && stations.length > 0) {
        const bounds = L.latLngBounds(
          stations.filter(s => s.lat && s.lon).map(s => [s.lat, s.lon])
        );
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    async function showRouteOnMap(route) {
      if (routeLine) map.removeLayer(routeLine);
      yandexLinkContainer.style.display = 'none';

      try {
        const points = route.coords.map(c => `point=${c[1]},${c[0]}`).join('&');
        const url = `https://graphhopper.com/api/1/route?${points}&vehicle=car&locale=ru&key=${GH_API_KEY}&avoid=toll&points_encoded=false`;

        const response = await fetch(url);
        if (!response.ok) throw new Error('GraphHopper error');
        const data = await response.json();
        if (!data.paths || data.paths.length === 0) throw new Error('No route');

        const coords = data.paths[0].points.coordinates;
        const latlngs = coords.map(c => [c[1], c[0]]);
        routeLine = L.polyline(latlngs, { color: '#1565C0', weight: 5, opacity: 0.8 }).addTo(map);

        // Формируем URL для Яндекс.Карт (по желанию)
        const yandexUrl = buildYandexMapUrl(route.coords.map(c => [c[1], c[0]]));
        const link = document.getElementById('yandex-link');
        link.href = yandexUrl;
        yandexLinkContainer.style.display = 'block';
      } catch (e) {
        console.warn('GraphHopper failed, fallback to straight lines', e);
        const latlngs = route.coords.map(c => [c[1], c[0]]);
        routeLine = L.polyline(latlngs, { color: '#1565C0', weight: 5, opacity: 0.8 }).addTo(map);
        yandexLinkContainer.style.display = 'none';
      }
    }

    function buildYandexMapUrl(points) {
      const coordsStr = points.map(p => `${p[1]},${p[0]}`).join('~');
      return `https://yandex.ru/maps/?rtext=${coordsStr}&rtt=auto`;
    }

        // ============================================================
    // Пункт 5. Панель сетей: раскрытие, сортировка, центрирование на АЗС
    // ============================================================

    // Хранит данные о сетях и станциях, чтобы обрабатывать клики.
    let networksData = {};

    function updateNetworkPanel(stations) {
      // Группируем станции по сетям.
      const byNetwork = {};
      stations.forEach(station => {
        const netName = station.network_name || 'Прочие';
        if (!byNetwork[netName]) {
          byNetwork[netName] = {
            name: netName,
            region: station.region || '',
            stations: [],
            minPrice: null,
            minPriceText: null,
            color: getMarkerColor(station, getPriceForFuel(station, currentFuel))
          };
        }
        const p = getPriceForFuel(station, currentFuel);
        if (p && !p.is_discount && p.price_value > 0) {
          if (byNetwork[netName].minPrice === null || p.price_value < byNetwork[netName].minPrice) {
            byNetwork[netName].minPrice = p.price_value;
          }
        } else if (p && p.is_discount) {
          // У сети только текстовые цены — берём первую как ориентир.
          if (byNetwork[netName].minPriceText === null) {
            byNetwork[netName].minPriceText = p.discount_text || 'условие';
          }
        }
        byNetwork[netName].stations.push(station);
      });

      // Сортируем сети по минимальной цене (числовые — вперёд, текстовые в конце).
      const networkNames = Object.keys(byNetwork).sort((a, b) => {
        const A = byNetwork[a], B = byNetwork[b];
        if (A.minPrice !== null && B.minPrice !== null) return A.minPrice - B.minPrice;
        if (A.minPrice !== null) return -1;
        if (B.minPrice !== null) return 1;
        return a.localeCompare(b);
      });

      // Самая дешёвая сеть.
      const cheapestNet = networkNames.length > 0 && byNetwork[networkNames[0]].minPrice !== null
        ? networkNames[0] : null;

      // Формируем HTML.
      const listDiv = document.getElementById('network-list');
      let html = '';
      if (networkNames.length === 0) {
        html = '<div style="color:#888; text-align:center; padding:12px;">Нет станций с ценами</div>';
      } else {
        networkNames.forEach(netName => {
          const net = byNetwork[netName];
          const isCheapest = netName === cheapestNet;
                   let priceLabel;
          let priceColor = '';
          if (net.minPrice !== null) {
            priceLabel = net.minPrice.toFixed(2) + ' ₽/л';
          } else if (net.minPriceText) {
            priceLabel = net.minPriceText;
            const upper = net.minPriceText.toUpperCase();
            priceColor = upper.includes('НАЦЕНКА') ? '#E8720C' : '#16A34A';
          } else {
            priceLabel = '—';
          }

          html += `<div class="network-item network-item-clickable ${isCheapest ? 'cheapest' : ''}" data-network="${encodeURIComponent(netName)}" onclick="toggleNetwork('${encodeURIComponent(netName)}')">
            <div>
              <span class="dot-indicator" style="background:${net.color}"></span>
              <span>${netName}</span>
              ${net.region ? `<span class="network-region">${net.region}</span>` : ''}
              <span class="network-arrow">▶</span>
            </div>
                        <div class="network-price"${priceColor ? ` style="color:${priceColor};"` : ''}>${priceLabel}</div>
          </div>
          <div class="network-stations" id="netstations-${encodeURIComponent(netName)}"></div>`;
        });
      }
      listDiv.innerHTML = html;

      // Сохраняем данные для кликов.
      networksData = byNetwork;

      // Для Excel.
      window._networkData = {
        nets: networkNames,
        details: Object.fromEntries(
          networkNames.map(n => [n, { price: byNetwork[n].minPrice || 0, count: byNetwork[n].stations.length }])
        ),
        routeName: clientMapTitle || 'Карта АЗС'
      };
    }

    // Раскрывает/сворачивает сеть и заполняет список её АЗС.
    function toggleNetwork(encodedName) {
      const netName = decodeURIComponent(encodedName);
      const el = document.querySelector(`.network-item[data-network="${encodedName}"]`);
      const listEl = document.getElementById(`netstations-${encodedName}`);
      if (!el || !listEl) return;

      const isExpanded = el.classList.contains('expanded');
      if (isExpanded) {
        el.classList.remove('expanded');
        listEl.classList.remove('expanded');
        return;
      }

      // Формируем список станций, отсортированный по цене.
      const net = networksData[netName];
      if (!net) return;
      const sortedStations = net.stations.slice().sort((a, b) => {
        const pa = getPriceForFuel(a, currentFuel);
        const pb = getPriceForFuel(b, currentFuel);
        const va = pa && !pa.is_discount ? pa.price_value : 99999;
        const vb = pb && !pb.is_discount ? pb.price_value : 99999;
        return va - vb;
      });

      let html = '';
      sortedStations.forEach(st => {
        const p = getPriceForFuel(st, currentFuel);
        let priceLine = '';
        if (p) {
          if (p.is_discount) {
            const upper = (p.discount_text || '').toUpperCase();
            const c = upper.includes('НАЦЕНКА') ? '#E8720C' : '#16A34A';
            priceLine = `<div class="station-row-price" style="color:${c};">${p.discount_text || 'условие'}</div>`;
          } else if (p.price_value) {
            priceLine = `<div class="station-row-price">${p.price_value.toFixed(2)} ₽/л</div>`;
          }
        }
        html += `<div class="station-row" onclick="focusStation('${st.id}')">
          <div class="station-row-name">${st.name || 'АЗС'}</div>
          <div class="station-row-addr">${st.address || ''}</div>
          ${priceLine}
        </div>`;
      });
      listEl.innerHTML = html || '<div style="padding:6px;color:#888;">Нет станций</div>';

      el.classList.add('expanded');
      listEl.classList.add('expanded');
    }

    // Центрирует карту на выбранной АЗС и открывает попап.
    function focusStation(stationId) {
      const st = allStations.find(s => s.id === stationId);
      if (!st || !st.lat || !st.lon) return;
      const latlng = [st.lat, st.lon];
      map.setView(latlng, Math.max(map.getZoom(), 13), { animate: true });
      markersLayer.eachLayer(layer => {
        const ll = layer.getLatLng && layer.getLatLng();
        if (ll && Math.abs(ll.lat - latlng[0]) < 0.00001 && Math.abs(ll.lng - latlng[1]) < 0.00001) {
          if (layer.openPopup) layer.openPopup();
        }
      });
    }

    // Сворачивает / разворачивает панель на мобильной.
    function togglePanel() {
      const panel = document.getElementById('network-panel');
      if (!panel) return;
      panel.classList.toggle('collapsed');
    }
      // ============================================================
    // Копирование адреса станции из попапа
    // ============================================================
    function copyAddressById(stationId, btnEl) {
      const station = filteredStations.find(s => s.id === stationId);
      if (!station || !station.address) return;
      const text = station.address;

      const onDone = () => {
        if (btnEl) {
          const old = btnEl.textContent;
          btnEl.textContent = '✓';
          btnEl.style.color = '#16A34A';
          btnEl.style.borderColor = '#16A34A';
          setTimeout(() => {
            btnEl.textContent = old;
            btnEl.style.color = '';
            btnEl.style.borderColor = '';
          }, 1200);
        }
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(onDone).catch(() => {
          fallbackCopyAddress(text, onDone);
        });
      } else {
        fallbackCopyAddress(text, onDone);
      }
    }

    function fallbackCopyAddress(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        if (cb) cb();
      } catch (e) {
        console.warn('Не удалось скопировать адрес:', e);
      }
      document.body.removeChild(ta);
    }
       window.downloadExcel = function() {
      if (!window._networkData) return;
      const data = window._networkData;
      const wb = XLSX.utils.book_new();

      // ---------- Считаем километраж каждой станции вдоль маршрута ----------
      // Если маршрута нет — km остаётся null, колонка «Км» не выводится.
      const hasRoute = !!clientRouteGeojson;

      let stationsWithKm = filteredStations.map(station => {
        const price = getPriceForFuel(station, currentFuel);
        let km = null;

        if (hasRoute && station.lat && station.lon) {
          try {
            const line = turf.lineString(clientRouteGeojson.coordinates);
            const pt = turf.point([station.lon, station.lat]);
            // nearestPointOnLine возвращает properties.location — долю
            // от 0 до 1, показывающую положение проекции точки на линии.
            const snapped = turf.nearestPointOnLine(line, pt, { units: 'kilometers' });
            const totalLen = turf.length(line, { units: 'kilometers' });
            km = totalLen * (snapped.properties.location || 0);
          } catch (e) {
            km = null;
          }
        }

        return { station, price, km };
      });

      // Сортируем по километражу, если маршрут есть.
      if (hasRoute) {
        stationsWithKm.sort((a, b) => {
          if (a.km === null && b.km === null) return 0;
          if (a.km === null) return 1;
          if (b.km === null) return -1;
          return a.km - b.km;
        });
      }

      // ---------- Формируем шапку и сводку ----------
      const rows = [
        ['Коммерческое предложение'],
        ['Маршрут: ' + data.routeName],
        ['Дата: ' + new Date().toLocaleDateString()],
        [],
        ['Минимальная цена', Math.min(...Object.values(data.details).map(d => d.price)).toFixed(2) + ' ₽/л'],
        ['Средняя цена', (Object.values(data.details).reduce((sum, d) => sum + d.price, 0) / data.nets.length).toFixed(2) + ' ₽/л'],
        ['Количество сетей', data.nets.length],
        [],
        ['Сеть', 'Мин. цена на маршруте']
      ];

      data.nets.forEach(net => {
        const nd = data.details[net];
        rows.push([net, nd.price.toFixed(2) + ' ₽/л']);
      });

      rows.push([]);

      // ---------- Шапка таблицы станций ----------
      const header = hasRoute
        ? ['Км', 'Название', 'Адрес', 'Сеть', 'Цена', 'Скидка']
        : ['Название', 'Адрес', 'Сеть', 'Цена', 'Скидка'];
      rows.push(header);

      // ---------- Строки станций ----------
      stationsWithKm.forEach(({ station, price, km }) => {
        const name = station.name || '';
        const address = station.address || '';
        const network = station.network_name || '';
        let priceStr = '';
        let discountStr = '';

        if (price) {
          if (price.is_discount) {
            discountStr = price.discount_text || 'скидка';
          } else if (price.price_value) {
            priceStr = price.price_value;
          }
        }

        if (hasRoute) {
          rows.push([
            km !== null ? km.toFixed(1) : '',
            name, address, network, priceStr, discountStr
          ]);
        } else {
          rows.push([name, address, network, priceStr, discountStr]);
        }
      });

      // ---------- Записываем файл ----------
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = hasRoute
        ? [{ wch: 8 }, { wch: 25 }, { wch: 30 }, { wch: 20 }, { wch: 10 }, { wch: 15 }]
        : [{ wch: 25 }, { wch: 30 }, { wch: 20 }, { wch: 10 }, { wch: 15 }];

      XLSX.utils.book_append_sheet(wb, ws, 'Маршрут');
      XLSX.writeFile(wb, 'АЗС_маршрут.xlsx');
    };

    function showGreeting(area, showGreetingFlag) {
      if (!showGreetingFlag) return;
      const greetingKey = 'greeting_shown_' + token;
      if (sessionStorage.getItem(greetingKey)) {
        const banner = document.getElementById('greeting-banner');
        banner.textContent = getGreetingMessage(area);
        banner.style.display = 'block';
        setTimeout(() => banner.style.display = 'none', 5000);
      } else {
        document.getElementById('greeting-text').textContent = getGreetingMessage(area);
        document.getElementById('greeting-overlay').style.display = 'flex';
        sessionStorage.setItem(greetingKey, 'true');
      }
    }

    function getGreetingMessage(area) {
      let bestPrice = null;
      let bestStation = null;
      allStations.forEach(station => {
        if (area && station.region && station.region.toLowerCase().indexOf(area.toLowerCase()) !== -1) {
          const price = getPriceForFuel(station, currentFuel);
          if (price && !price.is_discount && price.price_value > 0) {
            if (bestPrice === null || price.price_value < bestPrice) {
              bestPrice = price.price_value;
              bestStation = station;
            }
          }
        }
      });
      let msg = 'Предлагаем заправку по нашей партнёрской сети с оптовыми ценами.';
      if (bestStation) {
        msg += ` Лучшая цена в ${area}: ${bestPrice.toFixed(2)} ₽/л (${bestStation.name}).`;
      } else {
        msg += ' Цены действительны для всей России.';
      }
      return msg;
    }

       // Загрузка данных
    fetch(`${API_URL}?token=${token}`)
      .then(response => {
        if (!response.ok) throw new Error('Network response was not ok');
        return response.json();
      })
      .then(data => {
        if (data.stations) {
          allStations = data.stations;
          const meta = data.meta || {};
          const area = meta.area || 'России';
          const showGreetingFlag = meta.show_greeting !== false;

          // Новое: читаем маршрут, заголовок и радиус из meta.
                    clientRouteGeojson = meta.route_geojson || null;
          clientMapTitle = meta.map_title || null;
          clientRadiusKm = meta.radius_km || 5;

          // Если есть маршрут — определяем, какие станции вдоль него.
          if (clientRouteGeojson) {
            computeStationsOnRoute();
          }

          buildFuelButtons();
          buildViewTabs();       // кнопки «Вся сеть / Мой маршрут» (если есть маршрут)
          drawClientRoute();     // рисуем линию маршрута (если есть)
          showMapTitle();        // показываем заголовок (если есть)
          applyFilters();        // рисуем станции
          showGreeting(area, showGreetingFlag);
        } else {
          allStations = data;
          buildFuelButtons();
          applyFilters();
        }
      })
      .catch(error => {
        console.error('Error fetching stations:', error);
        document.body.innerHTML = `<h2 style="text-align:center;margin-top:50px;">Ошибка загрузки данных: ${error.message}</h2>`;
      });
        // ============================================================
    // Шаг 10. Отрисовка маршрута клиента и заголовка карты
    // ============================================================
    // ============================================================
    // Пункт 3. Фильтрация станций вдоль маршрута
    // ============================================================

    // Определяет, какие станции попадают в радиус вдоль маршрута.
    // Использует Turf.js — та же логика, что в конструкторе.
    function computeStationsOnRoute() {
      if (!clientRouteGeojson || !clientRouteGeojson.coordinates) {
        stationsOnRoute = [];
        return;
      }
      try {
        const line = turf.lineString(clientRouteGeojson.coordinates);
        const radiusKm = clientRadiusKm || 5;
        stationsOnRoute = allStations.filter(station => {
          if (!station.lat || !station.lon) return false;
          const dist = turf.pointToLineDistance(
            turf.point([station.lon, station.lat]),
            line,
            { units: 'kilometers' }
          );
          return dist <= radiusKm;
        });
      } catch (e) {
        console.warn('Не удалось вычислить станции вдоль маршрута:', e);
        stationsOnRoute = [];
      }
    }

    // Строит кнопки-вкладки сверху. Показывает их только если есть маршрут.
    function buildViewTabs() {
      const panel = document.querySelector('.control-panel');
      if (!panel) return;

      // Убираем старые вкладки, если были.
      const old = document.getElementById('view-tabs');
      if (old) old.remove();

      // Если маршрута нет — вкладки не нужны.
      if (!clientRouteGeojson) return;

      const div = document.createElement('div');
      div.className = 'view-tabs';
      div.id = 'view-tabs';
      div.innerHTML = `
        <button class="view-tab" data-view="network" onclick="switchView('network')">Вся сеть</button>
        <button class="view-tab active" data-view="route" onclick="switchView('route')">Мой маршрут</button>
      `;
      panel.insertBefore(div, panel.firstChild);
    }

    // Переключение между вкладками.
    function switchView(view) {
      if (view === currentView) return;
      currentView = view;

      // Подсвечиваем активную кнопку.
      document.querySelectorAll('.view-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.view === view);
      });

      // Показываем / скрываем маршрут.
      if (view === 'route') {
        if (clientRouteLine && !map.hasLayer(clientRouteLine)) {
          clientRouteLine.addTo(map);
        }
      } else {
        if (clientRouteLine && map.hasLayer(clientRouteLine)) {
          map.removeLayer(clientRouteLine);
        }
      }

      // Перерисовываем станции.
      applyFilters();
    }
    // Рисует линию маршрута, если он задан в meta.route_geojson.
    function drawClientRoute() {
      if (!clientRouteGeojson || !clientRouteGeojson.coordinates) return;

      if (clientRouteLine) {
        map.removeLayer(clientRouteLine);
      }

      // route_geojson.coordinates — массив [lon, lat].
      // Leaflet ждёт [lat, lon].
      const latlngs = clientRouteGeojson.coordinates.map(c => [c[1], c[0]]);

      clientRouteLine = L.polyline(latlngs, {
        color: '#1565C0',
        weight: 5,
        opacity: 0.85
      }).addTo(map);

      // Подстраиваем карту под маршрут.
      map.fitBounds(clientRouteLine.getBounds(), { padding: [50, 50] });
    }

    // Показывает заголовок карты в панели управления сверху.
    function showMapTitle() {
      if (!clientMapTitle) return;

      const panel = document.querySelector('.control-panel');
      if (!panel) return;

      // Удаляем старый заголовок, если он был (на случай перезагрузки).
      const old = document.getElementById('map-title');
      if (old) old.remove();

      const div = document.createElement('div');
      div.id = 'map-title';
      div.style.cssText = 'flex-basis:100%; text-align:center; margin-bottom:4px;';
      div.textContent = clientMapTitle;

      panel.insertBefore(div, panel.firstChild);
    }
  </script>
</body>
